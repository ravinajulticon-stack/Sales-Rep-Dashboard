<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sales Rep History</title>
<style>
  :root{
    --ink-primary:#1a2233;
    --ink-secondary:#5b6577;
    --ink-muted:#8a93a3;
    --surface:#f4f6fa;
    --surface-card:#ffffff;
    --border:#e4e7ec;
    --brand:#2a78d6;
    --brand-dark:#1c5cab;
    --good:#0ca30c;
    --radius:12px;
    --sidebar-w:224px;
    --sidebar-bg:#0e1830;
    --sidebar-text:#93a1c0;
    --sidebar-text-active:#ffffff;
    --sidebar-active-bg:#1c3f73;
    /* categorical slots — fixed order, never reassigned by filters */
    --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100;
    --s5:#e87ba4; --s6:#008300; --s7:#4a3aa7; --s8:#e34948;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--surface);
    color:var(--ink-primary);
  }

  /* ---------- Sidebar ---------- */
  .sidebar{
    position:fixed; top:0; left:0; bottom:0; width:var(--sidebar-w);
    background:var(--sidebar-bg); display:flex; flex-direction:column;
    padding:20px 12px; z-index:20;
  }
  .sidebar-logo{color:#fff; display:flex; align-items:center; gap:8px; padding:4px 10px 22px; font-weight:700; font-size:15px;}
  .sidebar-logo svg{flex-shrink:0;}
  .nav-group{display:flex; flex-direction:column; gap:2px;}
  .nav-item{
    display:flex; align-items:center; gap:10px; padding:9px 12px; border-radius:8px;
    color:var(--sidebar-text); font-size:13.5px; font-weight:600; cursor:pointer; border:none; background:none;
    text-align:left; width:100%; font-family:inherit;
  }
  .nav-item svg{flex-shrink:0; opacity:.85;}
  .nav-item:hover{color:#fff; background:rgba(255,255,255,.06);}
  .nav-item.active{color:var(--sidebar-text-active); background:var(--sidebar-active-bg);}
  .nav-divider{border-top:1px solid rgba(255,255,255,.09); margin:14px 4px;}
  .navgrp{font-size:10.5px; letter-spacing:.08em; text-transform:uppercase; color:#5f6e8f; font-weight:700; padding:16px 12px 4px;}
  .nav-footer{margin-top:auto; display:flex; flex-direction:column; gap:2px;}

  .app{margin-left:var(--sidebar-w);}
  .wrap{max-width:1280px;margin:0 auto;padding:24px 28px 60px;}

  .top{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:20px;flex-wrap:wrap;}
  h1{font-size:21px;margin:0 0 4px;letter-spacing:-0.01em;}
  .subtitle{color:var(--ink-secondary);font-size:13.5px;margin:0;}
  .status-pill{
    display:inline-flex;align-items:center;gap:6px;flex-shrink:0;
    background:#eef6ee;color:#1a6b2f;border:1px solid #cfe8d2;
    padding:5px 12px;border-radius:100px;font-size:12.5px;font-weight:600;
  }
  .status-pill .dot{width:6px;height:6px;border-radius:50%;background:var(--good);}
  .status-pill.stale{background:#fff4e0;color:#8a5b00;border-color:#f0d59a;}
  .status-pill.stale .dot{background:#c98a05;}
  .top-actions{display:flex;align-items:center;gap:10px;flex-shrink:0;flex-wrap:wrap;}
  .btn{
    appearance:none;border:1px solid var(--border);background:#fff;color:var(--ink-primary);
    padding:7px 13px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px;
  }
  .btn:hover{border-color:#c7ceda;}
  .btn-primary{border-color:var(--brand);background:var(--brand);color:#fff;}
  .btn-primary:hover{background:var(--brand-dark);}
  .btn:disabled{opacity:.6;cursor:default;}
  .import-msg{font-size:12.5px;margin:-12px 0 14px;min-height:1em;}
  .import-msg.ok{color:var(--good);}
  .import-msg.err{color:#c0392b;}
  .import-msg.busy{color:var(--ink-secondary);}

  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:20px;}
  .stat-card{background:var(--surface-card);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;display:flex;gap:12px;align-items:flex-start;}
  .stat-icon{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .stat-label{font-size:12px;color:var(--ink-muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em;margin-bottom:6px;}
  .stat-value{font-size:22px;font-weight:700;letter-spacing:-0.02em;}
  .stat-sub{font-size:12.5px;color:var(--ink-secondary);margin-top:4px;}

  .toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:16px;}
  .toolbar select, .toolbar input[type="text"]{
    border:1px solid var(--border);background:#fff;border-radius:8px;padding:8px 12px;font-size:13.5px;color:var(--ink-primary);min-width:150px;
  }
  .toolbar input[type="text"]{min-width:210px;}
  .toolbar input.date-input{min-width:0;padding:8px 10px;}
  .toolbar .grow{flex:1;}
  .toolbar .result-count{font-size:12.5px;color:var(--ink-muted);white-space:nowrap;}
  .chk{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--ink-secondary);cursor:pointer;}
  .chk input{cursor:pointer;}
  .chk-hint{color:var(--ink-muted);font-size:12px;}

  .card{background:var(--surface-card);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;}
  .card-head{padding:16px 18px 4px;display:flex;align-items:baseline;justify-content:space-between;gap:10px;}
  .card-head h2{font-size:15px;margin:0;}
  .card-head .count{font-size:12.5px;color:var(--ink-muted);white-space:nowrap;}
  .card-link{font-size:12.5px;font-weight:600;color:var(--brand);text-decoration:none;cursor:pointer;white-space:nowrap;}
  .card-link:hover{text-decoration:underline;}

  .table-scroll{max-height:560px;overflow:auto;}
  table{width:100%;border-collapse:collapse;font-size:13.5px;}
  thead th{position:sticky;top:0;background:var(--surface-card);text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-muted);font-weight:700;padding:10px 18px;border-bottom:1px solid var(--border);white-space:nowrap;cursor:default;}
  thead th.num, tbody td.num{text-align:right;}
  tbody td{padding:11px 18px;border-bottom:1px solid var(--border);white-space:nowrap;}
  tbody tr:last-child td{border-bottom:none;}
  tbody tr:hover{background:#fafbfc;}
  tbody tr.clickable{cursor:pointer;}
  tbody tr.clickable:hover{background:#eef4fc;}
  tbody tr.row-selected{background:#e8f1fc;}
  .rep-name{font-weight:600;}
  .rep-email{color:var(--ink-muted);font-size:12px;display:block;font-weight:400;}
  .rep-dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:7px;flex-shrink:0;vertical-align:middle;}
  .badge{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:100px;background:#e8f6ee;color:var(--good);}
  .badge .idot{width:5px;height:5px;border-radius:50%;background:currentColor;}
  /* Sell Price Tier / Payment Mode tags */
  .tbl-compact thead th, .tbl-compact tbody td{padding-left:10px;padding-right:10px;}
  .tag{display:inline-flex;align-items:center;font-size:12px;font-weight:600;padding:2px 9px;border-radius:100px;white-space:nowrap;}
  .tag-tier{background:#e8f1fc;color:var(--brand-dark);}
  .tag-pay{background:#f1f3f7;color:var(--ink-secondary);}
  .tag-more{padding:2px 2px;color:var(--ink-muted);}
  .tag-none{color:var(--ink-muted);}
  .tag-wrap{display:inline-flex;align-items:center;gap:4px;}
  .acct-selected-chips{display:flex;gap:18px;flex-wrap:wrap;align-items:center;margin:-6px 0 14px;}
  .acct-selected-chips:empty{display:none;}
  .chip-pair{display:inline-flex;align-items:center;gap:7px;font-size:12px;color:var(--ink-muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em;}
  .chip-pair .tag{text-transform:none;letter-spacing:0;}
  .feed-note{margin:0 0 16px;}
  .mix-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px;margin-bottom:18px;align-items:start;}
  .empty-row td{color:var(--ink-muted);text-align:center;padding:30px 18px;}
  .row-chevron{color:var(--ink-muted);float:right;}

  .two-col{display:grid;grid-template-columns:1.3fr 1fr;gap:16px;margin-bottom:18px;align-items:start;}
  @media (max-width: 1000px){ .stats{grid-template-columns:repeat(2,1fr);} .two-col{grid-template-columns:1fr;} .dash-layout{grid-template-columns:1fr !important;} }
  @media (max-width: 820px){ .app{margin-left:0;} }

  .chart-card{padding:18px;}
  .chart-scroll{max-height:400px;overflow-y:auto;}
  .chart-row{margin-bottom:13px;}
  .chart-row:last-child{margin-bottom:0;}
  .chart-top{display:flex;align-items:baseline;justify-content:space-between;gap:14px;margin-bottom:5px;}
  .chart-label{flex:1;min-width:0;font-size:12.5px;font-weight:600;color:var(--ink-secondary);word-break:break-word;line-height:1.35;display:flex;align-items:center;gap:6px;}
  .chart-label .rep-dot{flex-shrink:0;}
  .chart-value{flex-shrink:0;font-size:12.5px;font-weight:700;white-space:nowrap;color:var(--ink-primary);text-align:right;}
  .chart-value-sub{display:block;font-weight:400;color:var(--ink-muted);font-size:11px;}
  .chart-track{background:#eef0f3;border-radius:4px;height:14px;position:relative;overflow:hidden;}
  .chart-fill{height:100%;border-radius:4px;}

  .note{margin-top:20px;padding:12px 16px;border:1px dashed #c9d3e0;border-radius:10px;font-size:12.5px;color:var(--ink-secondary);background:#f8f9fb;}
  .note b{color:var(--ink-primary);}
  th.sortable{cursor:pointer;user-select:none;}
  th.sortable:hover{color:var(--ink-secondary);}
  th.sortable .arrow{opacity:.4;margin-left:3px;}
  th.sortable.active .arrow{opacity:1;color:var(--brand);}

  /* ---------- Dashboard page layout ---------- */
  .dash-layout{display:grid;grid-template-columns:230px 1fr;gap:16px;align-items:start;margin-bottom:16px;}
  .bdm-panel{background:var(--surface-card);border:1px solid var(--border);border-radius:var(--radius);padding:14px;}
  .bdm-panel-title{font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-muted);font-weight:700;margin:0 0 10px;}
  .bdm-search{width:100%;border:1px solid var(--border);border-radius:8px;padding:7px 10px;font-size:13px;margin-bottom:10px;}
  .bdm-list{display:flex;flex-direction:column;gap:2px;max-height:420px;overflow-y:auto;}
  .bdm-item{display:flex;align-items:center;gap:8px;padding:9px 10px;border-radius:8px;cursor:pointer;font-size:13.5px;font-weight:600;color:var(--ink-secondary);}
  .bdm-item:hover{background:#f2f4f8;}
  .bdm-item.active{background:#e8f1fc;color:var(--brand-dark);}
  .bdm-list-sm{max-height:150px;}
  .dash-main-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:12px;flex-wrap:wrap;}
  .dash-main-head h2{font-size:16px;margin:0;}
  .dash-main-head h2 b{color:var(--brand-dark);}
  .dash-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;}
  @media (max-width:700px){ .dash-stats{grid-template-columns:1fr;} }
  .acct-selected-label{font-size:12px;color:var(--ink-muted);text-transform:uppercase;letter-spacing:.04em;font-weight:700;margin:0 0 2px;}
  .acct-selected-name{font-size:17px;font-weight:700;color:var(--brand-dark);margin:0 0 14px;}

  .filter-overlay{position:fixed;inset:0;background:rgba(15,20,35,.35);z-index:40;display:none;align-items:flex-start;justify-content:flex-start;}
  .filter-overlay.open{display:flex;}
  .filter-panel{background:#fff;width:320px;height:100%;padding:22px;box-shadow:8px 0 24px rgba(0,0,0,.12);display:flex;flex-direction:column;gap:14px;overflow-y:auto;}
  .filter-panel h3{margin:0 0 4px;font-size:16px;}
  .filter-field label{display:block;font-size:12px;font-weight:700;color:var(--ink-muted);text-transform:uppercase;letter-spacing:.03em;margin-bottom:6px;}
  .filter-field select, .filter-field input[type="text"]{width:100%;}
  .filter-close{margin-left:auto;border:none;background:none;font-size:20px;line-height:1;cursor:pointer;color:var(--ink-muted);}

  /* ---------- Sign-in gate ---------- */
  /* Font + sizing matched to the DDL Product Price & Stock dashboard's login card */
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
  .auth-overlay{
    position:fixed; inset:0; z-index:100; background:var(--surface);
    display:flex; align-items:center; justify-content:center; padding:24px;
    font-family:'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  .auth-card{
    box-sizing:border-box;
    width:100%; max-width:360px; background:var(--surface-card); border:1px solid var(--border);
    border-radius:16px; padding:32px 28px; box-shadow:0 8px 40px rgba(0,0,0,.14);
  }
  .auth-title{color:var(--ink-primary); font-size:19px; font-weight:600; margin:0 0 4px;}
  .auth-sub{color:var(--ink-secondary); font-size:13px; margin:0 0 24px; line-height:1.4;}
  .auth-field label{display:block; color:var(--ink-secondary); font-size:12px; margin:0 0 6px;}
  .auth-input-wrap{position:relative; display:flex; align-items:center; margin-bottom:16px;}
  .auth-input-wrap input{
    width:100%; box-sizing:border-box; background:var(--surface); border:1px solid var(--border); color:var(--ink-primary);
    border-radius:8px; padding:10px 40px 10px 12px; font-size:14px; font-family:inherit;
  }
  .auth-input-wrap input:focus{outline:none; border-color:#007aff;}
  .auth-toggle{
    position:absolute; right:6px; border:none; background:none; color:var(--ink-muted);
    cursor:pointer; padding:6px; display:flex; align-items:center; border-radius:6px;
  }
  .auth-toggle:hover{color:var(--ink-primary); background:rgba(0,0,0,.05);}
  .auth-btn{
    width:100%; background:#007aff; color:#fff; border:none; border-radius:8px;
    padding:11px; font-size:14px; font-weight:600; cursor:pointer; font-family:inherit;
  }
  .auth-btn:hover{background:#0060df;}
  .auth-btn:disabled{opacity:.6; cursor:default;}
  .auth-error{color:#ff3b30; font-size:12.5px; margin:12px 0 0; min-height:17px;}
  .auth-overlay[hidden]{display:none;}

  /* ---------- History page additions ---------- */
  .muted{color:var(--ink-muted);}
  .up{color:#0a8a4a;font-weight:700;} .down{color:#c0392b;font-weight:700;}
  .fbar{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;margin-bottom:10px;}
  .fsel{display:flex;flex-direction:column;gap:4px;font-size:11.5px;}
  .fsel b{color:var(--ink-muted);text-transform:uppercase;letter-spacing:.04em;font-size:11px;}
  .fsel select{border:1px solid var(--border);background:#fff;border-radius:8px;padding:8px 10px;font-size:13.5px;color:var(--ink-primary);min-width:150px;font-family:inherit;}
  .seg{display:inline-flex;border:1px solid var(--border);border-radius:8px;overflow:hidden;background:#fff;}
  .seg button{border:none;background:#fff;padding:8px 13px;font-size:13px;font-weight:600;color:var(--ink-secondary);cursor:pointer;font-family:inherit;border-right:1px solid var(--border);}
  .seg button:last-child{border-right:none;}
  .seg button.on{background:#e8f1fc;color:var(--brand-dark);}
  .infobar{display:flex;gap:8px;align-items:flex-start;background:#eef4fc;border:1px solid #d6e4f7;color:#2c4a73;border-radius:10px;padding:9px 13px;font-size:12.5px;line-height:1.45;margin-bottom:16px;}
  .why{margin-top:12px;background:#fff8ef;border:1px solid #f3dcbc;border-radius:10px;padding:11px 14px;font-size:13.5px;line-height:1.5;color:#5b4326;}
  .hero-big{font-size:34px;font-weight:700;letter-spacing:-0.02em;}
  .hero-big.down{color:#c0392b;} .hero-big.up{color:#0a8a4a;}
  .hero-sub{font-size:13.5px;color:var(--ink-secondary);margin-top:4px;}
  .legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-secondary);margin-bottom:8px;}
  .legend i{display:inline-block;width:12px;height:4px;border-radius:2px;margin-right:6px;vertical-align:middle;}
  .rowbar{display:grid;grid-template-columns:130px 1fr auto;gap:12px;align-items:center;margin-bottom:12px;font-size:12.5px;}
  .rowbar .lab{font-weight:600;color:var(--ink-secondary);word-break:break-word;}
  .rowbar .pair{position:relative;height:22px;}
  .rowbar .pair div{position:absolute;left:0;height:10px;border-radius:3px;}
  .badge-lost{display:inline-block;background:#fdecea;color:#c0392b;font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:100px;}
  .sel-trend{display:grid;grid-template-columns:1.3fr 1fr;gap:16px;align-items:start;margin-bottom:18px;}
  @media (max-width:1000px){.sel-trend{grid-template-columns:1fr;}}
  .kv{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
  .kv>div{background:var(--surface-card);border:1px solid var(--border);border-radius:10px;padding:10px 12px;}
  .kv small{display:block;font-size:11px;color:var(--ink-muted);font-weight:700;text-transform:uppercase;letter-spacing:.03em;margin-bottom:4px;}
  .kv strong{font-size:14.5px;}
  .lk{display:block;font-size:11.5px;color:var(--ink-muted);font-weight:400;}
  th.hl,td.hl{background:#f6f9fe;}
  .mini-note{font-size:12px;color:var(--ink-muted);margin:18px 0 0;line-height:1.5;}
  .hit:hover{fill:rgba(42,120,214,.07);}
  .rowbar:hover{background:#f6f9fe;}
  #tip{position:fixed;display:none;z-index:60;pointer-events:none;background:#1a2233;color:#fff;font-size:12.5px;padding:8px 11px;border-radius:8px;white-space:pre-line;line-height:1.5;max-width:300px;box-shadow:0 4px 16px rgba(0,0,0,.25);}
  .menu-btn{display:none;}
  @media (max-width:820px){
    .menu-btn{display:inline-flex;}
    .sidebar{display:flex;transform:translateX(-100%);transition:transform .2s;}
    .sidebar.open{transform:none;box-shadow:8px 0 24px rgba(0,0,0,.3);}
    .wrap{padding:16px 14px 50px;}
    .stats{grid-template-columns:repeat(2,1fr);}
    .kv{grid-template-columns:repeat(2,1fr);}
    .rowbar{grid-template-columns:90px 1fr;} .rowbar>div:last-child{grid-column:1/-1;}
    .fsel select{min-width:0;width:100%;} .fsel{flex:1 1 140px;}
    .stats[style]{grid-template-columns:1fr !important;} .two-col[style]{grid-template-columns:1fr !important;}
  }
  .tbl-compact td:first-child{white-space:normal;min-width:170px;max-width:250px;}
  .tbl-compact .rep-name{white-space:normal;}
  .tbl-compact thead th, .tbl-compact tbody td{padding-left:8px;padding-right:8px;}
  @media (max-width:820px){ .chart-card{overflow-x:auto;} .chart-card svg{min-width:620px;} }
  .navgrp{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:#5f6e8f;font-weight:700;padding:16px 12px 4px;}
  .tabrow{display:flex;gap:4px;border-bottom:1px solid var(--border);margin:0 0 18px;overflow-x:auto;}
  .tab{border:none;background:none;font:inherit;font-size:13.5px;font-weight:600;color:var(--ink-muted);padding:10px 14px;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;}
  .tab:hover{color:var(--ink-primary);} .tab.active{color:var(--brand);border-bottom-color:var(--brand);}
</style>
</head>
<body>
<div class="auth-overlay" id="authOverlay">
  <div class="auth-card">
    <h1 class="auth-title">Sales Rep History</h1>
    <p class="auth-sub">Past sales for the allocated accounts. Please sign in to continue.</p>
    <form id="authForm">
      <div class="auth-field">
        <label for="authPassword">Password</label>
        <div class="auth-input-wrap">
          <input type="password" id="authPassword" autocomplete="current-password" />
          <button type="button" class="auth-toggle" id="authToggle" aria-label="Show password">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7Z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
      </div>
      <button type="submit" class="auth-btn">Sign In</button>
      <p class="auth-error" id="authError"></p>
    </form>
  </div>
</div>

function mergeLive(rows){
  for(const r of rows){
    const a = BY_CODE.get(String(r.customer_code||'').trim().toLowerCase());
    if(!a || !r.completed_date) continue;
    const d = sydneyDate(new Date(r.completed_date));
    const tier = String(r.sell_price_tier||'').trim();
    if(tier && d >= a.tierAt){ a.tier = tier; a.tierAt = d; }
    const pm = String(r.payment_mode||'').trim();
    if(pm){ if(!a.pays.has(pm)) a.pays.set(pm, new Set()); a.pays.get(pm).add(r.order_no); }
    if(d <= HIST.through) continue;               // already covered by the embedded history
    LINES.push({a:a.id, d, mi:miFromDate(d), o:String(r.order_no), p:String(r.product_code||''), q:Number(r.quantity)||0, s:Number(r.sub_total)||0, t:String(r.customer_type||'').trim()||'Unspecified'});

    if(!lr.ok) throw new Error('status ' + lr.status);
    const latest = await lr.json();
    if(!latest.length) return [];
    const rows = [], PAGE = 1000;
    for(let from = 0; ; from += PAGE){
      const rr = await fetch(`${SUPA_URL}/rest/v1/${TABLE}?select=customer_code,completed_date,order_no,product_code,quantity,sub_total,customer_type,sell_price_tier,payment_mode&batch_id=eq.${encodeURIComponent(latest[0].batch_id)}&order=id.asc`,
        {headers:{...hdr, Range:`${from}-${from+PAGE-1}`, 'Range-Unit':'items'}, signal:ctl.signal});
      if(!rr.ok && rr.status !== 206) throw new Error('status ' + rr.status);
      const page = await rr.json(); rows.push(...page);
      if(page.length < PAGE || rows.length >= 200000) break;
    }
    return rows;
  } finally { clearTimeout(to); }
}

/* ---------- filter bar ---------- */
function selHTML(id, label, value, options){
  return `<label class="fsel"><b>${esc(label)}</b><select data-f="${id}">${options.map(([v,t]) => `<option value="${esc(v)}"${v===value?' selected':''}>${esc(t)}</option>`).join('')}</select></label>`;
}
function filterBar(extraRight){
  const reps = [...new Set(ACCTS.map(a => a.bdm))].sort();
  const types = [...new Set(LINES.map(l => l.t))].sort();
  const tiers = [...new Set(ACCTS.map(a => a.tier||NONE))].sort((a,b) => a===NONE?1:b===NONE?-1:a.localeCompare(b,undefined,{numeric:true}));
  const pays = [...new Set([...ACCTS.flatMap(a => [...a.pays.keys()]), NONE])].sort((a,b) => a===NONE?1:b===NONE?-1:a.localeCompare(b));
  return `<div class="fbar">`
    + selHTML('rep','Current Sales Rep',state.rep,[['','All Sales Reps'],...reps.map(r => [r,r])])
    + selHTML('type','Customer Type',state.type,[['','All'],...types.map(r => [r,r])])
    + selHTML('tier','Current Sell Price Tier',state.tier,[['','All'],...tiers.map(r => [r,r])])
    + selHTML('pay','Payment Mode (Account)',state.pay,[['','All'],...pays.map(r => [r,r])])
    + `<span style="flex:1"></span>${extraRight||''}</div>`
    + `<div class="infobar"><span>ⓘ</span><span><b>How The Filters Work:</b> Sales Rep, Sell Price Tier And Payment Mode Use Each Account&#39;s <b>Current</b> Setting, Applied To Its Full History. Payment Mode Matches Accounts That Have Used That Mode, Because One Account Can Use More Than One. This Page Covers The ${ACCTS.length} Allocated Accounts In Alicia&#39;s List; ${ACCTS.filter(a => LINES.some(l => l.a===a.id)).length} Of Them Have Orders.</span></div>`;
}

/* ================= TAB: WHAT CHANGED ================= */
function wcRanges(){
  const fy = fyOf(ANCHOR); let a, b;
  switch(state.wcPeriod){
    case '3m': a = ANCHOR-2; b = ANCHOR; break;
    case '6m': a = ANCHOR-5; b = ANCHOR; break;
    case 'fytd': a = fyStart(fy); b = ANCHOR; break;
    case 'lfy': a = fyStart(fy-1); b = fyStart(fy)-1; break;
    default: a = ANCHOR-11; b = ANCHOR;
  }
  const len = b-a+1, shift = state.wcCompare === 'yoy' ? 12 : len;
  return {a, b, pa:a-shift, pb:b-shift};
}
const WC_PERIODS = [['3m','Last 3 Months'],['6m','Last 6 Months'],['12m','Last 12 Months'],['fytd','This Financial Year To Date'],['lfy','Last Financial Year']];
function plural(n, w){ return n + ' ' + w + (n===1?'':'s'); }
function renderChanged(){
  const L = filteredLines(), R = wcRanges();
  const cur = agg(L, R.a, R.b), old = agg(L, R.pa, R.pb);
  const covered = R.pa >= FIRST_MI;
  const ids = [...new Set([...cur.byAcct.keys(), ...old.byAcct.keys()])];
  const cat = {stopped:[], less:[], more:[], fresh:[]};
  ids.forEach(id => { const A = old.byAcct.get(id)||0, B = cur.byAcct.get(id)||0;
    const row = {id, A, B, d:B-A};
    if(A>0 && B<=0) cat.stopped.push(row); else if(A<=0 && B>0) cat.fresh.push(row); else if(B<A) cat.less.push(row); else if(B>A) cat.more.push(row); });
  const sumD = rows => rows.reduce((s,r) => s+r.d, 0);
  const dS = sumD(cat.stopped), dL = sumD(cat.less), dM = sumD(cat.more), dN = sumD(cat.fresh);
  const D = cur.rev - old.rev, p = pctChange(cur.rev, old.rev);
  const curLab = rangeLabel(R.a, R.b), oldLab = rangeLabel(R.pa, R.pb);
  let headline, hero;
  if(!covered || old.rev <= 0){ headline = 'No Comparison Data For This Period'; hero = `<div class="hero-big">${$$(cur.rev)}</div><div class="hero-sub">Revenue in ${esc(curLab)}. There is no revenue in ${esc(oldLab)} to compare with.</div>`; }
  else { headline = `Revenue Is ${D<0?'Down':D>0?'Up':'Flat'} ${Math.abs(p).toFixed(1)}%`;
    hero = `<div class="hero-big ${D<0?'down':D>0?'up':''}">${D<0?'▼':D>0?'▲':''} ${$$(Math.abs(D))}</div><div class="hero-sub">${$$(old.rev)} in ${esc(oldLab)} → ${$$(cur.rev)} in ${esc(curLab)}</div>`; }
  const bits = [];
  if(cat.stopped.length) bits.push(`${plural(cat.stopped.length,'account')} stopped ordering altogether (${$$(Math.abs(dS))} lost).`);
  if(cat.less.length) bits.push(`${plural(cat.less.length,'account')} kept ordering but spent less (${$$(Math.abs(dL))} lost).`);
  if(cat.more.length) bits.push(`${plural(cat.more.length,'account')} spent more (${$$(dM)} gained).`);
  if(cat.fresh.length) bits.push(`${plural(cat.fresh.length,'new account')} ordered for the first time in this comparison (${$$(dN)} gained).`);
  const why = (covered && old.rev>0 && bits.length) ? `<div class="why"><b>In Plain Terms:</b> ${bits.join(' ')} The net ${D<0?'fall':'change'} is ${$$(Math.abs(D))}.</div>` : '';
  // bridge
  const steps = [{n:oldLab,v:old.rev,t:'total'},{n:'Accounts That Stopped Ordering',v:dS,t:'d'},{n:'Accounts Ordering Less',v:dL,t:'d'},{n:'Accounts Ordering More',v:dM,t:'d'},{n:'New Accounts',v:dN,t:'d'},{n:curLab,v:cur.rev,t:'total'}];
  const W=1130,H=300,l=60,r=10,t=34,b=56, iw=W-l-r, ih=H-t-b, step=iw/steps.length, bw=step*0.58;
  let run=0, hi=0; steps.forEach(st => { if(st.t==='total'){ run=st.v; } else run+=st.v; hi=Math.max(hi,run,st.t==='total'?st.v:0); }); run=0;
  const ax = axisTicks(Math.max(hi,1)*1.08), top = ax.top, Y = v => t + ih*(1 - v/top);
  let s = `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Where the change came from" style="display:block">`;
  ax.ticks.forEach(v => { s += `<line x1="${l}" x2="${W-r}" y1="${Y(v)}" y2="${Y(v)}" stroke="#e9ecf1"/><text x="${l-8}" y="${Y(v)+4}" text-anchor="end" font-size="11" fill="#8a93a3">${$k(v)}</text>`; });
  steps.forEach((st,i) => {
    const x = l + step*i + (step-bw)/2; let y0,y1,col,lab;
    if(st.t==='total'){ y0=0; y1=st.v; run=st.v; col='#2a78d6'; lab=$k(st.v); } else { y0=run; y1=run+st.v; run=y1; col=st.v<0?'#d9534f':'#1baf7a'; lab=(st.v<0?'−':'+')+$k(Math.abs(st.v)); }
    const yt = Y(Math.max(y0,y1)), yb = Y(Math.min(y0,y1));
    s += `<rect x="${x}" y="${yt}" width="${bw}" height="${Math.max(yb-yt,2)}" rx="4" fill="${col}" data-tip="${esc(st.n+'\n'+(st.t==='total'?$$(st.v):(st.v<0?'−':'+')+$$(Math.abs(st.v))))}"/>`;
    s += `<text x="${x+bw/2}" y="${yt-6}" text-anchor="middle" font-size="12.5" font-weight="700" fill="${st.t==='total'?'#1a2233':col}">${lab}</text>`;
    const words = st.n.split(' '), mid = Math.ceil(words.length/2);
    [words.slice(0,mid).join(' '), words.slice(mid).join(' ')].forEach((ln,k) => { if(ln) s += `<text x="${x+bw/2}" y="${H-30+k*14}" text-anchor="middle" font-size="11.5" fill="#5b6577" font-weight="600">${esc(ln)}</text>`; });
    if(i<steps.length-1) s += `<line x1="${x+bw}" x2="${x+step}" y1="${Y(run)}" y2="${Y(run)}" stroke="#b9c1cf" stroke-dasharray="3 3"/>`;
  });
  s += '</svg>';
  const aov = r => r.orders.size ? r.rev/r.orders.size : 0;
  const tiles = (covered && old.rev>0)
    ? stat('Orders', cur.orders.size.toLocaleString('en-AU'), deltaHTML(cur.orders.size, old.orders.size) + ` from ${old.orders.size.toLocaleString('en-AU')}`, ICON_CART,'#f2eafd','#7a4ae0')
      + stat('Average Order Value', $$(aov(cur)), deltaHTML(aov(cur), aov(old)) + ` from ${$$(aov(old))}`, ICON_MONEY,'#fdf0e2','#eb6834')
      + stat('Active Accounts', cur.active, deltaHTML(cur.active, old.active) + ` from ${old.active}`, ICON_B,'#e8f1fc','#2a78d6')
    : stat('Orders', cur.orders.size.toLocaleString('en-AU'), '', ICON_CART,'#f2eafd','#7a4ae0') + stat('Average Order Value', $$(aov(cur)), '', ICON_MONEY,'#fdf0e2','#eb6834') + stat('Active Accounts', cur.active, '', ICON_B,'#e8f1fc','#2a78d6');
  // accounts table
  const all = [...cat.stopped, ...cat.less, ...cat.more, ...cat.fresh];
  const list = (state.wcList === 'inc' ? all.filter(r => r.d>0).sort((a,b) => b.d-a.d) : all.filter(r => r.d<0).sort((a,b) => a.d-b.d)).slice(0,10);
  const arows = list.map(r => { const a = ACCTS[r.id];
    return `<tr><td><span class="rep-name" style="white-space:normal">${esc(a.company)}</span></td><td>${esc(a.bdm)}</td><td class="num">${$$(r.A)}</td><td class="num">${r.B<=0 && r.A>0 ? '<span class="badge-lost">No Orders</span>' : $$(r.B)}</td><td class="num ${r.d<0?'down':'up'}">${r.d<0?'▼':'▲'} ${$$(Math.abs(r.d))}</td></tr>`; }).join('')
    || `<tr class="empty-row"><td colspan="5">No accounts ${state.wcList==='inc'?'increased':'decreased'} in this comparison.</td></tr>`;
  // products table
  const pk = [...new Set([...cur.byProd.keys(), ...old.byProd.keys()])].map(k => { const a = old.byProd.get(k)?.u||0, b = cur.byProd.get(k)?.u||0; return {k, a, b, d:b-a}; })
    .filter(r => r.d !== 0).sort((x,y) => (state.wcList==='inc' ? y.d-x.d : x.d-y.d)).filter(r => state.wcList==='inc' ? r.d>0 : r.d<0).slice(0,8);
  const prows = pk.map(r => `<tr><td><span class="rep-name">${esc(r.k)}</span></td><td class="num">${r.a}</td><td class="num">${r.b}</td><td class="num ${r.d<0?'down':'up'}">${r.d<0?'▼':'▲'} ${Math.abs(r.d)}</td></tr>`).join('')
    || `<tr class="empty-row"><td colspan="4">No products ${state.wcList==='inc'?'increased':'decreased'}.</td></tr>`;
  const controls = `<div class="fbar">`
    + selHTML('wcPeriod','Compare',state.wcPeriod,WC_PERIODS)
    + selHTML('wcCompare','With',state.wcCompare,[['yoy','Same Period Last Year'],['prev','Previous Period']])
    + selHTML('rep','Current Sales Rep',state.rep,[['','All Sales Reps'],...[...new Set(ACCTS.map(a => a.bdm))].sort().map(r => [r,r])])
    + `<span style="flex:1"></span><span class="seg" role="group" aria-label="Direction">${[['dec','Biggest Decreases'],['inc','Biggest Increases']].map(([k,t]) => `<button type="button" data-wclist="${k}" class="${state.wcList===k?'on':''}">${t}</button>`).join('')}</span></div>`
    + `<div class="infobar"><span>ⓘ</span><span><b>Current Rep Shown:</b> Each Account Is Listed Under Its Current Sales Rep. Accounts That Have Stopped Ordering Keep Their Last Known Rep. Tier, Payment Mode And Customer Type Filters Are On The History Tab.</span></div>`;
  return controls
    + `<div class="card" style="margin-bottom:18px"><div class="card-head"><h2>${esc(headline)}</h2><span class="count">${esc(curLab)} vs ${esc(oldLab)}</span></div><div class="chart-card">${hero}${why}</div></div>`
    + (covered ? `<div class="card" style="margin-bottom:18px"><div class="card-head"><h2>Where The Change Came From</h2><span class="count">${esc(oldLab)} to ${esc(curLab)}</span></div><div class="chart-card">${s}</div></div>` : `<div class="note">The comparison period (${esc(oldLab)}) starts before the first data in Jul 2020, so there is nothing to compare with. Choose a shorter period.</div>`)
    + `<div class="stats" style="grid-template-columns:repeat(3,1fr)">${tiles}</div>`

    + `<div class="card"><div class="card-head"><h2>Products Behind The Change</h2><span class="count">Units sold</span></div><div class="table-scroll"><table class="tbl-compact"><thead><tr><th>SKU</th><th class="num">Before</th><th class="num">After</th><th class="num">Change</th></tr></thead><tbody>${prows}</tbody></table></div></div></div>`;
}

/* ================= TAB: ACCOUNT TREND ================= */
function renderTrend(){
  const L = filteredLines();
  const rows = ACCTS.filter(passAcct).map(a => {
    const al = L.filter(l => l.a===a.id), allTime = LINES.filter(l => l.a===a.id && l.mi<=ANCHOR);
    const l12 = al.filter(l => l.mi>=ANCHOR-11).reduce((s,l) => s+l.s, 0), p12 = al.filter(l => l.mi>=ANCHOR-23 && l.mi<=ANCHOR-12).reduce((s,l) => s+l.s, 0);
    const last = allTime.reduce((m,l) => l.d>m ? l.d : m, '');
    return {a, l12, p12, last, has:allTime.length>0, tr:monthly(al, ANCHOR-23, ANCHOR)};
  }).sort((x,y) => (y.l12-x.l12) || ((y.has?1:0)-(x.has?1:0)) || x.a.company.localeCompare(y.a.company));
  if(state.acct==null || !rows.some(r => r.a.id===state.acct)) state.acct = (rows.find(r => r.has) || rows[0] || {a:{id:null}}).a.id;
  const trs = rows.map(r => {
    const chg = r.has ? (r.p12>0 ? deltaHTML(r.l12, r.p12) : (r.l12>0 ? '<span class="muted">No Prior Sales</span>' : '<span class="muted">—</span>')) : '<span class="muted">—</span>';
    return `<tr class="clickable ${r.a.id===state.acct?'row-selected':''}" data-acct="${r.a.id}" tabindex="0" role="button" aria-label="Show ${esc(r.a.company)}">
      <td><span class="rep-name">${esc(r.a.company)}</span>${r.has?'':'<span class="lk">No Orders Since Jul 2020</span>'}</td><td>${esc(r.a.bdm)}</td><td>${tierTag(r.a.tier)}</td><td>${payTags(r.a)}</td>
      <td class="num hl">${r.has?$$(r.l12):'—'}</td><td class="num hl">${chg}</td><td class="hl">${spark(r.tr)}</td><td>${ddmmyyyy(r.last)}</td><td><span class="row-chevron">›</span></td></tr>`; }).join('')
    || '<tr class="empty-row"><td colspan="9">No accounts match these filters.</td></tr>';
  // detail
  let detail = '';
  const sel = rows.find(r => r.a.id===state.acct);
  if(sel){
    const al = L.filter(l => l.a===sel.a.id), v = monthly(al, ANCHOR-23, ANCHOR);
    const o12 = agg(al, ANCHOR-11, ANCHOR), o24 = agg(al, ANCHOR-23, ANCHOR-12);
    let worst = null;                                         // 3-month window with the biggest drop vs the same months a year earlier
    for(let e = ANCHOR; e >= ANCHOR-9; e--){ const c = agg(al, e-2, e).rev, o = agg(al, e-14, e-12).rev, d = c-o; if(d < 0 && (!worst || d < worst.d)) worst = {d, e}; }
    const bars = barChart({vals:v, colors:v.map((_,i) => i<12 ? '#c9d1de' : '#2a78d6'), h:240, w:700, label:'Monthly revenue for the selected account',
      xl:v.map((_,i) => i%3===0 ? {i, t:miShort(ANCHOR-23+i)} : null).filter(Boolean), tip: i => `${miLabel(ANCHOR-23+i)}\nRevenue: ${$$(v[i])}`});
    const prodMap = new Map(); al.filter(l => l.mi>=ANCHOR-11).forEach(l => prodMap.set(l.p||'(No Code)', (prodMap.get(l.p||'(No Code)')||0) + l.q));
    const prods = [...prodMap].sort((a,b) => b[1]-a[1]).slice(0,5).map(([k,q]) => `<tr><td><span class="rep-name">${esc(k)}</span></td><td class="num">${q}</td></tr>`).join('') || '<tr class="empty-row"><td colspan="2">No orders in the last 12 months.</td></tr>';
    detail = `<p class="acct-selected-label">Account Selected</p><p class="acct-selected-name">${esc(sel.a.company)}</p>
      <div class="acct-selected-chips"><span class="chip-pair">Sell Price Tier ${tierTag(sel.a.tier)}</span><span class="chip-pair">Payment Mode ${payTags(sel.a)}</span><span class="chip-pair">Current Sales Rep <b>${esc(sel.a.bdm)}</b></span></div>
      <div class="sel-trend"><div class="card"><div class="card-head"><h2>Monthly Revenue, Last 24 Months</h2><span class="count">${esc(sel.a.company)}</span></div><div class="chart-card"><div class="legend"><span><i style="background:#2a78d6"></i>Last 12 Months</span><span><i style="background:#c9d1de"></i>Prior 12 Months</span></div>${bars}</div></div>
      <div><div class="kv"><div><small>Last 12 Months</small><strong>${$$(sel.l12)}</strong></div><div><small>Prior 12 Months</small><strong>${$$(sel.p12)}</strong></div><div><small>Change</small><strong>${sel.p12>0 ? deltaHTML(sel.l12, sel.p12) : '—'}</strong></div><div><small>Orders, Last 12 Months</small><strong>${o12.orders.size}</strong></div><div><small>Last Order</small><strong>${ddmmyyyy(sel.last)}</strong></div><div><small>Biggest Drop</small><strong>${worst ? `${rangeLabel(worst.e-2, worst.e)} <span class="down">▼ ${$$(Math.abs(worst.d))}</span>` : 'None'}</strong></div></div>
      <div class="card" style="margin-top:12px"><div class="card-head"><h2>Top Products, Last 12 Months</h2><span class="count">Units</span></div><div class="table-scroll"><table class="tbl-compact"><tbody>${prods}</tbody></table></div></div></div></div>`;
  }
  const reps = [...new Set(ACCTS.map(a => a.bdm))].sort();
  return filterBar('')
    + `<div class="card" style="margin-bottom:18px"><div class="card-head"><h2>Allocated Accounts</h2><span class="count">${rows.length} account${rows.length===1?'':'s'} · trend columns highlighted</span></div><div class="table-scroll"><table class="tbl-compact"><thead><tr><th>Account</th><th>Current Sales Rep</th><th>Sell Price Tier</th><th>Payment Mode</th><th class="num hl">Last 12 Months</th><th class="num hl">Vs Prior 12 Months</th><th class="hl">24-Month Trend</th><th>Last Order</th><th></th></tr></thead><tbody>${trs}</tbody></table></div></div>` + detail;
}

/* ================= shell ================= */
const TITLES = {
  history:{t:'History', s:'Revenue over time for the allocated accounts, with trends you can filter'},
  changed:{t:'What Changed', s:'Compare two periods and see which accounts and products explain the difference'},
  trend:{t:'Account Trend', s:'How each allocated account is trending, and why'},
};
function renderPill(){
  const el = document.getElementById('dataPill');
  if(LIVE_OK){ el.classList.remove('stale'); el.innerHTML = '<span class="dot"></span>Live Feed To ' + esc(ddmmyyyy(LIVE_LAST || HIST.through)); }
  else { el.classList.add('stale'); el.innerHTML = '<span class="dot"></span>History Only To ' + esc(ddmmyyyy(HIST.through)); }
}
function render(){
  document.getElementById('pageTitle').textContent = TITLES[state.tab].t;
  document.getElementById('pageSub').textContent = TITLES[state.tab].s;
  document.querySelectorAll('.tab[data-tab]').forEach(b => b.classList.toggle('active', b.dataset.tab===state.tab));
  const body = state.tab==='history' ? renderHistory() : state.tab==='changed' ? renderChanged() : renderTrend();
  const foot = `<p class="mini-note">Amounts are the Sub Total from the Unleashed Sales Enquiry. Jul 2020 – Jun 2026 comes from the FY2021 – FY2026 exports; Jul 2026 onward is the live feed. The current month is left out until it is complete. Accounts are matched on customer code, so a customer who orders under a contact&#39;s name still counts toward the company.</p>`;
  const warn = LIVE_OK ? '' : `<div class="note">The live feed could not be reached, so this page only shows history up to ${esc(ddmmyyyy(HIST.through))}. Reload to try again.</div>`;
  document.getElementById('root').innerHTML = warn + body + foot;
}

/* ---------- events (delegated; nothing from the data is ever placed in an inline handler) ---------- */
const tip = document.getElementById('tip');
document.addEventListener('mousemove', e => {
  const el = e.target.closest && e.target.closest('[data-tip]');
  if(!el){ tip.style.display = 'none'; return; }
  tip.textContent = el.getAttribute('data-tip');
  tip.style.display = 'block';
  const x = Math.min(e.clientX + 14, window.innerWidth - tip.offsetWidth - 8), y = Math.min(e.clientY + 14, window.innerHeight - tip.offsetHeight - 8);
  tip.style.left = Math.max(4,x) + 'px'; tip.style.top = Math.max(4,y) + 'px';
});
document.addEventListener('change', e => {
  const f = e.target.dataset && e.target.dataset.f; if(!f) return;
  state[f] = e.target.value;
  if(f === 'rep'){ try{ localStorage.setItem('ddl_home_rep', state.rep); }catch(_){} }   // shared with Rep Home and the dashboard
  render();
});
function activate(el){
  if(el.dataset.gran){ state.gran = el.dataset.gran; render(); }
  else if(el.dataset.wclist){ state.wcList = el.dataset.wclist; render(); }
  else if(el.dataset.acct){ state.acct = Number(el.dataset.acct); render(); }
  else if(el.dataset.tab){ state.tab = el.dataset.tab; document.querySelector('.sidebar').classList.remove('open'); render(); window.scrollTo(0,0); }
}
document.addEventListener('click', e => { const el = e.target.closest('[data-gran],[data-wclist],[data-acct],[data-tab]'); if(el) activate(el); });
document.addEventListener('keydown', e => { if((e.key==='Enter'||e.key===' ') && e.target.matches && e.target.matches('tr[data-acct]')){ e.preventDefault(); activate(e.target); } });
document.getElementById('menuBtn').addEventListener('click', () => document.querySelector('.sidebar').classList.toggle('open'));
document.getElementById('signOutBtn').addEventListener('click', () => { try{ localStorage.removeItem(AUTH_KEY); }catch(_){} location.reload(); });

/* ---------- sign-in gate (same password and same browser sign-in as the dashboard) ---------- */
async function sha256Hex(text){ const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text)); return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2,'0')).join(''); }
async function start(){
  document.getElementById('authOverlay').setAttribute('hidden','');
  const hm = /^#trend=(.+)$/.exec(location.hash);        // deep link from the Home page: history.html#trend=<customer code>
  if(hm){ let c = ''; try{ c = decodeURIComponent(hm[1]); }catch(_){} const a = BY_CODE.get(c.toLowerCase()); if(a){ state.tab = 'trend'; state.acct = a.id; } }
  try{ const r = localStorage.getItem('ddl_home_rep'); if(r && ACCTS.some(a => a.bdm === r)) state.rep = r; }catch(_){}
  render();
  try { mergeLive(await fetchLive()); LIVE_OK = true; } catch(err){ console.error(err); LIVE_OK = false; }
  setAnchor(); renderPill(); render();
}
async function initAuth(){
  let ok = false;
  try { ok = localStorage.getItem(AUTH_KEY) === AUTH_HASH; } catch(_){}
  if(ok){ start(); return; }
  const form = document.getElementById('authForm'), input = document.getElementById('authPassword'), err = document.getElementById('authError'), toggle = document.getElementById('authToggle');
  toggle.addEventListener('click', () => { const show = input.type==='password'; input.type = show ? 'text' : 'password'; toggle.setAttribute('aria-label', show ? 'Hide password' : 'Show password'); });
  form.addEventListener('submit', async e => {
    e.preventDefault(); err.textContent = '';
    if(!input.value){ err.textContent = 'Enter the password.'; return; }
    if(await sha256Hex(input.value) === AUTH_HASH){ try{ localStorage.setItem(AUTH_KEY, AUTH_HASH); }catch(_){} start(); }
    else { err.textContent = 'Incorrect password.'; input.value = ''; input.focus(); }
  });
  input.focus();
}
setAnchor(); initAuth();

</script>
