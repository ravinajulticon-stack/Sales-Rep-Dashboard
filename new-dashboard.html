<style>

.chk{display:flex;align-items:center;gap:7px;height:37px;font-size:13px;cursor:pointer;white-space:nowrap}.chk input{width:auto;accent-color:#0a4fe1}

.clearall{border:none;background:none;color:var(--ink2);font-weight:700;cursor:pointer;font-size:12.5px;text-decoration:underline}
.tcard{background:var(--panel);border-radius:var(--radius);box-shadow:var(--shadow);margin:var(--gap) 0}.anim .tcard{animation:rise .55s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i) * 45ms)}
.tcard .wh{flex-wrap:wrap;padding:14px 16px 8px}.tscroll{overflow:auto}
table.big{font-size:12.5px}table.big th{padding:9px 12px;white-space:nowrap;background:#fafbfe}table.big td{padding:9px 12px;white-space:nowrap;vertical-align:middle}table.big td.wr{white-space:normal;min-width:180px;max-width:320px;line-height:1.35}
th.srt{cursor:pointer;user-select:none}th.srt:hover{color:var(--hi)}.ar{opacity:.35;font-size:10px}.ar.on{opacity:1;color:var(--hi)}
table.big tr.click{cursor:pointer}table.big tr.click:hover td{background:#f0f4fd}table.big tr.opn td{background:#eef3fd}tr.exp>td{background:#f7f9fe;padding:10px 16px 16px 40px!important;white-space:normal}
.chev{color:var(--muted);font-size:11px}.mut{color:var(--muted)}.lnk{color:#011389;font-weight:600}.lnk:hover{text-decoration:underline}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}
.odet{display:flex;gap:18px;flex-wrap:wrap;font-size:12.5px;color:var(--ink2);margin-bottom:8px;align-items:center}.odet b{color:var(--ink)}

.pager{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 16px;border-top:1px solid var(--grid);font-size:12.5px;color:var(--ink2)}.pgb{display:flex;gap:8px;align-items:center}.btn[disabled]{opacity:.4;cursor:default}
.g2x{display:grid;grid-template-columns:1fr 1fr;gap:24px;max-width:820px}.sh{font-weight:700;font-size:12.5px;margin-bottom:4px}.click{cursor:pointer}
.grid+.grid{margin-top:var(--gap)}
.editbar{display:none;align-items:center;gap:10px;background:#eef3ff;border:1.5px dashed var(--hi);border-radius:12px;padding:8px 12px;margin-bottom:14px;font-size:12.5px}.editing .editbar{display:flex}.editbar b{flex:1}
/* ---------- widget grid ---------- */
.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));grid-auto-rows:var(--row);grid-auto-flow:row dense;gap:var(--gap)}
.w{grid-column:span var(--w);grid-row:span var(--h);background:var(--panel);border-radius:var(--radius);box-shadow:var(--shadow);display:flex;flex-direction:column;min-width:0;min-height:0;position:relative;transition:box-shadow .25s,transform .25s}
.w:hover{box-shadow:var(--hover);transform:translateY(-2px)}
.wh{display:flex;align-items:center;gap:8px;padding:13px 15px 4px}.wh h4{margin:0;font-size:13.5px;font-weight:700;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.wh small{color:var(--muted);font-size:11px;white-space:nowrap}

.row{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--grid);font-size:12.5px}.row:last-child{border-bottom:none}.row .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.row b{white-space:nowrap}.row.click{cursor:pointer;border-radius:8px}.row.click:hover{background:#f0f4fd}
.bar{height:6px;border-radius:4px;background:var(--track);overflow:hidden;margin-top:4px}.bar i{display:block;height:100%;border-radius:4px}
.tag{font-size:10.5px;font-weight:700;border-radius:100px;padding:2px 8px;white-space:nowrap}.g{color:#0f8a5c;background:rgba(23,178,106,.14)}.a{color:#a66300;background:rgba(245,158,11,.18)}.r{color:#d92d32;background:rgba(229,72,77,.13)}.k{color:#011389;background:#e7eefc}.n{color:#5b6577;background:#eef0f3}
.seg{display:inline-flex;background:var(--track);border-radius:9px;padding:2px}.seg button{border:none;background:none;color:var(--ink2);font-weight:600;font-size:11px;padding:3px 9px;border-radius:7px;cursor:pointer}.seg button.on{background:#e7eefc;color:#011389}
.ic{width:30px;height:30px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0}.ic svg{width:15px;height:15px}
.minis{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}.minis button{border:1.5px solid #e6e4ec;background:#fff;color:var(--ink2);border-radius:100px;padding:3px 10px;font-weight:600;font-size:11.5px;cursor:pointer}.minis button.on{border-color:var(--hi);color:#011389;background:#e7eefc}
.kan{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;height:100%}.kcol{background:var(--track);border-radius:14px;padding:9px;min-height:0;overflow:auto}.kcol h5{margin:2px 4px 9px;font-size:12px;display:flex;justify-content:space-between}.kc{background:#fff;border-radius:11px;padding:9px 10px;margin-bottom:8px;font-size:12px;border-left:3px solid;box-shadow:var(--shadow);cursor:pointer}.kc .m{display:flex;justify-content:space-between;color:var(--muted);font-size:11px;margin-top:3px}

.hm{display:grid;gap:4px;font-size:11.5px}.hm div{border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:700;min-height:32px}.hm .lb{justify-content:flex-start;font-weight:600;background:none!important;min-width:0;white-space:nowrap;overflow:hidden}
.cal{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.cal h6{margin:0 0 5px;font-size:11.5px;color:var(--ink2)}.cg{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}.cg span{aspect-ratio:1;border-radius:4px;background:var(--track);font-size:8.5px;color:var(--muted);display:flex;align-items:center;justify-content:center}.cg span.x{color:#fff;font-weight:800}
svg .gl{stroke:var(--grid)}svg .ax{fill:var(--muted);font-size:10px}svg .lb{fill:var(--ink);font-size:10.5px;font-weight:700}

/* ---------- motion ---------- */
.anim .w{animation:rise .55s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i) * 45ms)}@keyframes rise{from{opacity:0;transform:translateY(14px) scale(.985)}to{opacity:1;transform:none}}

.skel .w>*{visibility:hidden}.skel .w{background:linear-gradient(100deg,#fff 30%,#eef1f7 50%,#fff 70%) 0 0/300% 100%;animation:shim 1s linear infinite}@keyframes shim{to{background-position:-150% 0}}

.panel h3{margin:0;font-size:17px}.panel .x{border:none;background:var(--track);width:30px;height:30px;border-radius:9px;cursor:pointer;font-size:15px}

.sizes{display:flex;gap:3px}.sizes button{border:1px solid #e6e4ec;background:#fff;color:var(--ink2);font-weight:700;font-size:10px;padding:2px 6px;border-radius:5px;cursor:pointer}.sizes button.on{background:var(--hi);color:#fff;border-color:var(--hi)}

</style></head><body>
<div class="auth" id="auth"><form class="authcard" id="authForm"><span class="brand" style="color:var(--ink);margin:0"><i></i></span><h1>Sales Rep Dashboard</h1><p>New design preview. Please sign in to continue.</p><label for="pw">Password</label><input type="password" id="pw" autocomplete="current-password"><button type="submit">Sign In</button><p class="autherr" id="authErr"></p></form></div>

/* ---------------- Older orders kept after they leave the feed's window ----------------
   The feed pulls a rolling window from Unleashed (90 days at the moment) and every
   upload is kept in the database. The pages read the newest upload, so an order
   disappears once it is older than the window. This adds those orders back from
   the earlier uploads. Read-only: nothing in the database is changed.

   An order is added back only when it dropped out because of its age:
     - it is not in the newest upload (the newest upload always wins);
     - every line was Completed when it was last seen;
     - it is older than every order in all later uploads (it fell off the back of
       the window, whatever length the window is);
     - no newer order of the same customer dropped out at the same time (that
       means the customer was changed in Unleashed, e.g. moved to another rep).
   One upload per day is enough for this (the 23:xx UTC one); if the feed's
   schedule changes, the hour of the newest upload is used instead. */
async function fetchCarriedLines(latestRows, latestBatchId, cols, signal){
  if(!latestRows.length || !latestBatchId) return [];
  const t = v => v ? new Date(v).getTime() : NaN;
  const done = r => !String(r.status || '').trim() || String(r.status).trim() === 'Completed';
  const minDone = rows => { let m = Infinity; for(const r of rows){ const x = t(r.completed_date); if(done(r) && x < m) m = x; } return m; };
  const hdr = {apikey: SUPA_KEY};
  async function snapshots(hour){
    const out = [], PAGE = 1000;
    const like = encodeURIComponent(`*T${hour}:*-n8n`);
    for(let from = 0; ; from += PAGE){
      const r = await fetch(`${SUPA_URL}/rest/v1/${TABLE}?select=${cols}&batch_id=like.${like}&order=batch_id.asc,id.asc`,
        {headers:{...hdr, Range:`${from}-${from+PAGE-1}`, 'Range-Unit':'items'}, signal});
      if(!r.ok && r.status !== 206) throw new Error('status ' + r.status);
      const page = await r.json(); out.push(...page);
      if(page.length < PAGE || out.length >= 100000) break;
    }
    return out;
  }
  let rows = await snapshots('23');
  const lastSnap = rows.length ? rows[rows.length-1].imported_at : null;
  const latestAt = t(latestBatchId.slice(0, 24));
  if(!lastSnap || latestAt - t(lastSnap) > 3*864e5){
    const hh = latestBatchId.slice(11, 13);
    if(hh !== '23') rows = rows.concat(await snapshots(hh)).sort((a, b) => a.batch_id < b.batch_id ? -1 : a.batch_id > b.batch_id ? 1 : (a.id||0) - (b.id||0));
  }

  // group into uploads, oldest first; the newest upload goes last
  const ups = [];
  for(const r of rows){
    if(r.batch_id === latestBatchId) continue;
    if(!ups.length || ups[ups.length-1].id !== r.batch_id) ups.push({id:r.batch_id, rows:[]});
    ups[ups.length-1].rows.push(r);
  }
  ups.push({id:latestBatchId, rows:latestRows});
  for(const u of ups){
    u.orders = new Map();
    for(const r of u.rows){ const k = String(r.order_no); if(!u.orders.has(k)) u.orders.set(k, []); u.orders.get(k).push(r); }
    u.min = minDone(u.rows);
  }
  // oldest completed date in each upload and everything after it
  const after = new Array(ups.length).fill(Infinity);
  for(let i = ups.length - 2; i >= 0; i--) after[i] = Math.min(ups[i+1].min, after[i+1]);

  const carried = new Map();
  for(let i = 0; i < ups.length - 1; i++){
    const cur = ups[i], next = ups[i+1];
    if(!next.rows.length) { next.orders = cur.orders; next.rows = cur.rows; continue; }   // empty upload: nothing learnt
    for(const k of next.orders.keys()) carried.delete(k);                            // back in the feed: the feed wins
    const aged = [], movedCust = new Set();
    for(const [k, ls] of cur.orders){
      if(next.orders.has(k)) continue;
      const old = ls.every(r => done(r) && t(r.completed_date) < after[i]);
      if(old) aged.push([k, ls]); else movedCust.add(String(ls[0].customer_code || ls[0].customer || ''));
    }
    for(const [k, ls] of aged){
      if(movedCust.has(String(ls[0].customer_code || ls[0].customer || ''))) continue;
      carried.set(k, ls);
    }
  }
  for(const k of ups[ups.length-1].orders.keys()) carried.delete(k);
  return [].concat(...carried.values()).map(r => ({...r, carried:true}));
}
async function safeCarry(latestRows, latestBatchId, cols){
  try { return await fetchCarriedLines(latestRows, latestBatchId, cols); }
  catch(err){ console.error('Older orders not loaded', err); return []; }
}
/* Open orders have no completed date, and the feed has no order date yet. Until it
   does, show when the order first came through in the hourly uploads ("Added"). */
async function addFirstSeen(lines){
  const open = [...new Set(lines.filter(l => l.status && String(l.status).trim() !== 'Completed' && !l.order_date).map(l => String(l.order_no)))];
  if(!open.length) return;
  const first = new Map();
  await Promise.all(open.slice(0, 200).map(async o => {
    try {
      const r = await fetch(`${SUPA_URL}/rest/v1/${TABLE}?select=imported_at&order_no=eq.${encodeURIComponent(o)}&order=imported_at.asc&limit=1`, {headers:{apikey: SUPA_KEY}});
      const d = r.ok ? await r.json() : [];
      if(d.length) first.set(o, d[0].imported_at);
    } catch(err){ /* leave it blank */ }
  }));
  for(const l of lines){ const f = first.get(String(l.order_no)); if(f && !l.order_date) l.first_seen = f; }
}

/* Customer names arrive exactly as typed in Unleashed ("Timber doors centre pty Ltd",
   "A1 CUSTOM HOMES", "mandeep kalsi"). Show them in Title Case. Words already in mixed
   case (MindMaze) and short codes (WHF, ACT, ATF, P/L, T/A) are left as they are.
   Display only: nothing in the database changes. */
const NAME_KEEP_UPPER = new Set(['ACT','NSW','VIC','QLD','SA','WA','NT','TAS','ATF','WHF','DDL','MSL','IT','AU','NZ','UK','USA','HVAC','CCTV']);
const NAME_FIX = {LTD:'Ltd', MR:'Mr', MRS:'Mrs', MS:'Ms', DR:'Dr', ST:'St'};
const NAME_SMALL = new Set(['and','of','the','for','at','in','on','by','to','or']);
function niceName(s){
  if(!s) return s;
  let n = 0;
  return String(s).replace(/[A-Za-z0-9][A-Za-z0-9'’]*/g, w => {
    const first = n++ === 0;
    const up = w.toUpperCase(), lo = w.toLowerCase();
    if(/\d/.test(w) || w.length === 1) return w.length === 1 ? up : w;   // A1, single letters (T/A, P/L)
    if(w !== up && w !== lo) return w;                                   // mixed case: MindMaze, McKenzie
    if(NAME_FIX[up]) return NAME_FIX[up];
    if(w === up && (NAME_KEEP_UPPER.has(up) || !/[AEIOUY]/.test(up))) return w;   // WHF, ACT, ATF
    if(!first && NAME_SMALL.has(lo)) return lo;
    return up[0] + lo.slice(1);
  });
}

/* ---------------- Every assigned account (Mark's customer feed) ----------------
   Orders only tell the dashboard about accounts that have bought something. Once the
   Unleashed customer list comes through (table sales_customers), every account with a
   BDM is listed too, at $0 when it has no orders. Until that table exists this does
   nothing and the pages work exactly as before. Read-only. */
let CUSTOMERS = [];
const CUST_TABLE = 'sales_customers';
async function fetchCustomers(){
  try {
    const h = {apikey: SUPA_KEY};
    const PAGE = 1000;
    async function readAll(filter){
      const out = [];
      for(let from = 0; ; from += PAGE){
        const r = await fetch(`${SUPA_URL}/rest/v1/${CUST_TABLE}?select=*${filter}`, {headers:{...h, Range:`${from}-${from+PAGE-1}`, 'Range-Unit':'items'}});
        if(!r.ok && r.status !== 206) return null;
        const p = await r.json(); out.push(...p);
        if(p.length < PAGE || out.length >= 200000) break;
      }
      return out;
    }
    let rows = null;
    const lr = await fetch(`${SUPA_URL}/rest/v1/${CUST_TABLE}?select=batch_id&order=imported_at.desc&limit=1`, {headers:h});
    if(lr.ok){
      const latest = await lr.json();
      if(!latest.length) return [];
      rows = await readAll(`&batch_id=eq.${encodeURIComponent(latest[0].batch_id)}`);
    } else if(lr.status === 400){
      rows = await readAll('');            // no batch columns: the table holds just the current list
    }
    if(!rows) return [];                   // table not there yet
    const v = x => (x == null ? '' : String(x)).trim();
    const yes = x => x === true || /^(true|yes|y|1)$/i.test(v(x));
    return rows.filter(c => !yes(c.obsolete)).map(c => ({
      customer_code: v(c.customer_code),
      customer: niceName(v(c.customer ?? c.customer_name)),
      rep_name: v(c.rep_name ?? c.sales_person),
      customer_type: v(c.customer_type) || 'Unspecified',
      created: v(c.created_date ?? c.created_on) || null,
    })).filter(c => c.customer);
  } catch(err){ console.error('Customer list not loaded', err); return []; }
}

/* ======================= model ======================= */
const RANGES = [['all','All Time'],['fy','This Financial Year'],['week','This Week'],['month','This Month'],['last','Last Month'],['custom','Custom Range']];
function bounds(k){
  const now = new Date(), y = now.getFullYear(), m = now.getMonth();
  if(k === 'fy') return [new Date(m >= 6 ? y : y-1, 6, 1), null];
  if(k === 'month') return [new Date(y, m, 1), null];
  if(k === 'last') return [new Date(y, m-1, 1), new Date(y, m, 1)];
  if(k === 'week'){ const d = now.getDay(), s = new Date(y, m, now.getDate() + (d === 0 ? -6 : 1 - d)); return [s, new Date(s.getFullYear(), s.getMonth(), s.getDate() + 7)]; }
  if(k === 'custom'){ const s = ST.from ? new Date(ST.from + 'T00:00:00') : null; let e = ST.to ? new Date(ST.to + 'T00:00:00') : null; if(e) e = new Date(e.getFullYear(), e.getMonth(), e.getDate() + 1); return [s, e]; }
  return [null, null];
}
const lineOnly = () => !!(ST.wh || ST.pay || ST.tier || ST.ost || ST.prod);
function groupOrders(lines){
  const m = new Map();
  for(const l of lines){ const k = l.order_no; let o = m.get(k);
    if(!o){ o = {no:k, cust:l.customer, code:l.customer_code, rep:repOf(l), date:dateOf(l), val:0, qty:0, st:isDone(l) ? 'Completed' : cv(l.status), skus:[], lines:[], pay:''}; m.set(k, o); }
    o.lines.push(l); if(cv(l.payment_mode)) o.pay = cv(l.payment_mode);
    o.val += l.sub_total || 0; if(isProduct(l.product_code)){ o.qty += l.quantity || 0; o.skus.push(l.product_code); }
    const d = dateOf(l); if(d && (!o.date || d > o.date)) o.date = d; }
  return [...m.values()];
}
function model(opts = {}){
  const q = ST.q.trim().toLowerCase();
  const repOk = l => opts.allReps || !ST.rep || repOf(l) === ST.rep;
  const qOk = l => !q || cv(l.customer).toLowerCase().includes(q) || cv(l.order_no).toLowerCase().includes(q) || cv(l.product_code).toLowerCase().includes(q);
  const U = 'Unspecified';
  const fOk = l => (!ST.acct || l.customer === ST.acct) && (!ST.wh || (cv(l.warehouse) || U) === ST.wh) && (!ST.pay || (cv(l.payment_mode) || U) === ST.pay) && (!ST.type || (cv(l.customer_type) || U) === ST.type) && (!ST.tier || (cv(l.sell_price_tier) || U) === ST.tier);
  const base = LINES.filter(l => repOk(l) && qOk(l) && fOk(l));
  const doneSt = !ST.ost || ST.ost === 'Completed', openSt = l => !ST.ost || ST.ost === 'open' || cv(l.status) === ST.ost;
  const [a, b] = bounds(ST.range);
  const inR = l => { const d = dateOf(l); if(!d) return !a && !b; const t = new Date(d); return (!a || t >= a) && (!b || t < b); };
  const doneAll = base.filter(l => isDone(l) && doneSt), done = doneAll.filter(inR), open = base.filter(l => isOpenL(l) && openSt(l));
  const orders = groupOrders(done), openOrders = groupOrders(open);
  // months shown on charts: from the range start (or first order) to the range end (or now), at most 12
  const first = a || (doneAll.length ? new Date(doneAll.reduce((m,l) => dateOf(l) < m ? dateOf(l) : m, dateOf(doneAll[0]))) : new Date());
  const last = b ? new Date(b - 1) : new Date();
  const months = []; for(let d = new Date(first.getFullYear(), first.getMonth(), 1); d <= last; d.setMonth(d.getMonth()+1)) months.push(mkey(d));
  const ms = months.slice(-12);
  const reps = REPS.filter(r => opts.allReps || !ST.rep || r === ST.rep);
  const monthly = ms.map(mm => Object.fromEntries(reps.map(r => [r, done.filter(l => repOf(l) === r && mkey(dateOf(l)) === mm).reduce((s,l) => s + (l.sub_total||0), 0)])));
  // accounts: last order from all completed orders (so "days since" is true), revenue within the range
  const acc = new Map();
  for(const l of doneAll){ const k = l.customer; let x = acc.get(k); if(!x){ x = {cust:k, code:l.customer_code, rep:repOf(l), rev:0, orders:new Set(), last:null}; acc.set(k, x); }
    const d = dateOf(l); if(d && (!x.last || d > x.last)) x.last = d; if(inR(l)){ x.rev += l.sub_total || 0; x.orders.add(l.order_no); } }
  let accts = [...acc.values()].map(x => ({...x, orders:x.orders.size, d:x.last ? daysSince(x.last) : null}));
  if(CUSTOMERS.length && !q && !lineOnly()){ const have = new Set(accts.map(x => cv(x.code).toLowerCase()));
    for(const c of CUSTOMERS){ if(!REPS.includes(c.rep_name) || (ST.rep && !opts.allReps && c.rep_name !== ST.rep)) continue; if(have.has(c.customer_code.toLowerCase())) continue;
      accts.push({cust:c.customer, code:c.customer_code, rep:c.rep_name, rev:0, orders:0, last:null, d:null, none:true}); } }
  if(ST.act === 'ordered') accts = accts.filter(x => !x.none); else if(ST.act === 'none') accts = accts.filter(x => x.none || !x.orders);
  accts.sort((x,y) => y.rev - x.rev || (x.d ?? 9999) - (y.d ?? 9999));
  const total = done.reduce((s,l) => s + (l.sub_total||0), 0);
  // this month vs last month, whatever the date range
  const now = new Date(), tm = mkey(now), lm = mkey(new Date(now.getFullYear(), now.getMonth()-1, 1));
  const sumM = k => doneAll.filter(l => mkey(dateOf(l)) === k).reduce((s,l) => s + (l.sub_total||0), 0);
  return {base, done, doneAll, open, orders, openOrders, ms, reps, monthly, accts, total, thisM:sumM(tm), lastM:sumM(lm)};
}

/* ======================= charts ======================= */
function spark(vals, color, w = 120, h = 34){ if(vals.length < 2) vals = [0, ...vals]; const mx = Math.max(...vals, 1), st = w/(vals.length-1), pts = vals.map((v,i) => [i*st, h-4-(v/mx)*(h-10)]), p = pts.map(q => q.join(',')).join(' ');
  return `<svg width="100%" height="${h}" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none"><polygon points="0,${h} ${p} ${w},${h}" fill="${color}" opacity=".14"/><polyline class="draw" fill="none" stroke="${color}" stroke-width="2.2" stroke-linejoin="round" points="${p}" vector-effect="non-scaling-stroke"/></svg>`; }
function trendChart(M, W = 640, H = 240){
  const L = 46, B = 24, T = 18, R = 8, n = M.ms.length || 1;
  if(!M.ms.length || !M.total) return '<div class="empty">No completed sales in this period.</div>';
  let g = '';
  if(ST.trend === 'stacked'){
    const tot = M.monthly.map(m => Object.values(m).reduce((a,b) => a+b, 0)), mx = Math.max(...tot, 1)*1.15, bw = Math.min(70, (W-L-R)/n*.55);
    const x = i => L + (i+.5)*(W-L-R)/n, y = v => T + (H-T-B)*(1-v/mx);
    for(let i = 0; i <= 3; i++){ const v = mx*i/3; g += `<line class="gl" x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}"/><text class="ax" x="${L-6}" y="${y(v)+3}" text-anchor="end">${k$(v)}</text>`; }
    M.monthly.forEach((m,i) => { let base = 0; M.reps.forEach(r => { const v = m[r]; if(v <= 0) return; g += `<rect class="grow" style="--d:${i}" x="${x(i)-bw/2}" y="${y(base+v)+1}" width="${bw}" height="${Math.max(y(base)-y(base+v)-2,1)}" rx="5" fill="${RC[r]}" data-tip="<b>${esc(r)}</b><br>${mlab(M.ms[i])} ${M.ms[i].slice(0,4)}: ${money(v)}"/>`; base += v; });
      g += `<text class="lb" x="${x(i)}" y="${y(tot[i])-6}" text-anchor="middle">${tot[i] ? k$(tot[i]) : ''}</text><text class="ax" x="${x(i)}" y="${H-6}" text-anchor="middle">${mlab(M.ms[i])}</text>`; });
  } else {
    const mx = Math.max(...M.monthly.flatMap(m => Object.values(m)), 1)*1.12, x = i => n === 1 ? (L+W-R)/2 : L + i*(W-L-R)/(n-1), y = v => T + (H-T-B)*(1-v/mx);
    for(let i = 0; i <= 3; i++){ const v = mx*i/3; g += `<line class="gl" x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}"/><text class="ax" x="${L-6}" y="${y(v)+3}" text-anchor="end">${k$(v)}</text>`; }
    M.ms.forEach((m,i) => g += `<text class="ax" x="${x(i)}" y="${H-6}" text-anchor="middle">${mlab(m)}</text>`);
    M.reps.forEach(r => { const pts = M.monthly.map((m,i) => [x(i), y(m[r])]); if(!M.monthly.some(m => m[r])) return;
      g += `<polyline class="draw" fill="none" stroke="${RC[r]}" stroke-width="2.6" stroke-linejoin="round" points="${pts.map(p => p.join(',')).join(' ')}"/>`;
      pts.forEach((p,i) => g += `<circle cx="${p[0]}" cy="${p[1]}" r="4.5" fill="${RC[r]}" stroke="#fff" stroke-width="2" data-tip="<b>${esc(r)}</b><br>${mlab(M.ms[i])}: ${money(M.monthly[i][r])}"/>`); });
  }
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">${g}</svg>`;
}
const legend = M => `<div style="display:flex;gap:12px;flex-wrap:wrap;font-size:11px;color:var(--ink2);margin-bottom:4px">${M.reps.filter(r => M.monthly.some(m => m[r])).map(r => `<span><span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${RC[r]};margin-right:5px"></span>${esc(r)}</span>`).join('')}</div>`;
const avatar = (r, s = 26) => `<span class="av" style="background:${RC[r]};width:${s}px;height:${s}px;line-height:${s}px;font-size:${s < 26 ? 9.5 : 11}px">${ini(r)}</span>`;

/* ======================= widgets ======================= */
const RLABEL = () => (RANGES.find(r => r[0] === ST.range) || [,''])[1];
const W = {
 k_sales:{t:'Total Sales', sub:() => RLABEL(), hero:true, r(M){ const ch = M.lastM ? (M.thisM - M.lastM)/M.lastM*100 : null; const m = M.monthly.map(x => Object.values(x).reduce((a,b) => a+b, 0));
   return `<div class="kpi"><div class="v" data-count="${M.total}" data-fmt="money">${money(M.total)}</div><div class="s">${ch === null ? 'Completed sales' : `<span class="${ch >= 0 ? 'up' : 'down'}">${ch >= 0 ? '▲' : '▼'} ${Math.abs(ch).toFixed(0)}%</span> this month so far vs last month`}</div>${spark(m, '#ffffff')}</div>`; }},
 k_orders:{t:'Orders', sub:() => 'completed', r(M){ const m = M.ms.map(mm => M.orders.filter(o => mkey(o.date) === mm).length);
   return `<div class="kpi"><div class="v" data-count="${M.orders.length}">${M.orders.length}</div><div class="s">avg ${M.orders.length ? money(M.total/M.orders.length) : '$0.00'} per order</div>${spark(m, '#0a4fe1')}</div>`; }},
 k_accts:{t:'Accounts', sub:() => 'buying in period', r(M){ const buy = M.accts.filter(a => a.orders), act = M.accts.filter(a => a.d !== null && a.d <= 30).length, risk = M.accts.filter(a => a.d !== null && a.d > 90).length, all = M.accts.filter(a => a.d !== null).length;
   return `<div class="kpi"><div class="v" data-count="${buy.length}">${buy.length}</div><div class="s"><span class="tag g">${act} active</span><span class="tag r">${risk} at risk</span>${M.accts.some(a => a.none) ? `<span class="tag n">${M.accts.filter(a => a.none).length} no orders</span>` : ''}</div><div class="bar" style="height:8px"><i style="width:${all ? act/all*100 : 0}%;background:#17b26a"></i></div></div>`; }},
 k_open:{t:'Open Orders', sub:() => 'not yet completed', r(M){ const v = M.openOrders.reduce((s,o) => s + o.val, 0), old = M.openOrders.length ? Math.max(...M.openOrders.map(o => o.date ? daysSince(o.date) : 0)) : 0;
   return `<div class="kpi"><div class="v" data-count="${M.openOrders.length}">${M.openOrders.length}</div><div class="s"><b>${money(v)}</b>${M.openOrders.length ? ` · oldest ${old} days` : ''}</div><div style="display:flex;gap:4px;flex-wrap:wrap">${M.openOrders.slice(0,4).map(o => `<span class="tag a" data-tip="${esc(o.no)} · ${esc(o.cust)}">${esc(o.st)}</span>`).join('') || '<span class="tag g">All clear</span>'}</div></div>`; }},
 trend:{t:'Sales Trend', sub:() => 'by month', tools:() => `<span class="seg"><button class="${ST.trend === 'stacked' ? 'on' : ''}" data-act="trend" data-v="stacked">Stacked</button><button class="${ST.trend === 'lines' ? 'on' : ''}" data-act="trend" data-v="lines">Lines</button></span>`,
   r(M){ return `${legend(M)}<div class="fit" data-chart="trend" style="height:calc(100% - 22px)">${trendChart(M)}</div>`; }},
 leader:{t:'Rep Leaderboard', sub:() => 'click to filter', r(){ const A = model({allReps:true}); const rows = REPS.filter(r => r !== NO_REP).map(r => ({r, v:A.done.filter(l => repOf(l) === r).reduce((s,l) => s + (l.sub_total||0), 0), o:A.openOrders.filter(o => o.rep === r).length})).sort((a,b) => b.v - a.v); const mx = Math.max(rows[0]?.v || 0, 1);
   return rows.map((x,i) => `<div class="row click" data-act="rep" data-v="${esc(x.r)}" style="${ST.rep && ST.rep !== x.r ? 'opacity:.4' : ''}"><b style="color:var(--muted);width:14px">${i+1}</b>${avatar(x.r)}<div style="flex:1;min-width:0"><div style="display:flex;justify-content:space-between;gap:6px"><span class="nm" style="font-weight:600">${esc(x.r)}</span><b>${money(x.v)}</b></div><div class="bar"><i style="width:${x.v/mx*100}%;background:${RC[x.r]}"></i></div><div style="font-size:10.5px;color:var(--muted);margin-top:2px">${A.total ? Math.round(x.v/A.total*100) : 0}% of team sales${x.o ? ` · <span style="color:#a66300;font-weight:700">${x.o} open</span>` : ''}</div></div></div>`).join(''); }},
 accounts:{t:'Account Health', sub:() => 'days since last order', r(M){ const g = {All:M.accts.filter(a => !a.none), Active:M.accts.filter(a => a.d !== null && a.d <= 30), Cooling:M.accts.filter(a => a.d > 30 && a.d <= 90), 'At Risk':M.accts.filter(a => a.d > 90)}; if(M.accts.some(a => a.none)) g['No Orders Yet'] = M.accts.filter(a => a.none);
   const list = g[ST.acctF] || g.All;
   return `<div class="minis">${Object.keys(g).map(k => `<button class="${ST.acctF === k ? 'on' : ''}" data-act="acctF" data-v="${k}">${k} ${g[k].length}</button>`).join('')}</div>${list.map(a => { const h = a.none ? ['No Orders Yet','n'] : health(a.d); return `<div class="row click" data-act="acct" data-v="${esc(a.cust)}">${avatar(a.rep, 24)}<span class="nm">${esc(a.cust)}</span><span class="tag ${h[1]}">${a.none ? h[0] : a.d + 'd · ' + h[0]}</span><b style="width:88px;text-align:right">${money(a.rev)}</b></div>`; }).join('') || '<div class="empty">No accounts match.</div>'}`; }},
 feed:{t:'Needs Attention', sub:() => 'act on these first', r(M){ const it = [
     ...M.openOrders.map(o => ({ic:'clock', c:'rgba(245,158,11,.18)', col:'#a66300', t:`${o.no} is ${o.st}`, s:`${o.cust} · ${money(o.val)}${o.date ? ' · ' + daysSince(o.date) + ' days' : ''}`, a:o.cust})),
     ...M.accts.filter(a => a.d > 60).sort((a,b) => b.d - a.d).map(a => ({ic:'warn', c:'rgba(229,72,77,.13)', col:'#d92d32', t:a.cust, s:`No order for ${a.d} days · ${a.rep}`, a:a.cust})),
     ...M.orders.filter(o => o.date && daysSince(o.date) <= 7).sort((a,b) => a.date < b.date ? 1 : -1).map(o => ({ic:'check', c:'rgba(23,178,106,.15)', col:'#0f8a5c', t:`New order ${o.no}`, s:`${o.cust} · ${money(o.val)}`, a:o.cust}))];
   return it.map(x => `<div class="row click" data-act="acct" data-v="${esc(x.a)}" style="align-items:flex-start"><span class="ic" style="background:${x.c};color:${x.col}">${ico(x.ic)}</span><div style="min-width:0"><div style="font-weight:700;font-size:12.5px">${esc(x.t)}</div><div style="font-size:11px;color:var(--muted)">${esc(x.s)}</div></div></div>`).join('') || '<div class="empty">Nothing needs attention right now.</div>'; }},
 skus:{t:'Top SKUs', sub:() => 'units sold', r(M){ const m = new Map(); for(const l of M.done){ if(!cv(l.product_code) || (ST.prod && !isProduct(l.product_code))) continue;   /* as on the current dashboard: Product Lines Only hides install / delivery lines */ const x = m.get(l.product_code) || {u:0, v:0}; x.u += l.quantity || 0; x.v += l.sub_total || 0; m.set(l.product_code, x); }
   const p = [...m].sort((a,b) => b[1].u - a[1].u || b[1].v - a[1].v).slice(0, 10), mx = p.length ? p[0][1].u : 1;
   return p.map(([k,x]) => `<div style="margin-bottom:9px" data-tip="<b>${esc(k)}</b><br>${x.u} units · ${money(x.v)}"><div style="display:flex;justify-content:space-between;font-size:12px;gap:8px"><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(k)}</span><b>${x.u}</b></div><div class="bar"><i style="width:${x.u/mx*100}%;background:linear-gradient(90deg,#0a4fe1,#41b3f5)"></i></div></div>`).join('') || '<div class="empty">No products sold in this period.</div>'; }},
 heat:{t:'Rep × Month', sub:() => 'darker = more sales', r(){ const A = model({allReps:true}); const ms = A.ms.slice(-6), off = A.ms.length - ms.length, rows = REPS.filter(r => r !== NO_REP || A.done.some(l => repOf(l) === NO_REP));
   const mx = Math.max(...rows.flatMap(r => ms.map((_,i) => A.monthly[i+off][r] || 0)), 1);
   if(!ms.length) return '<div class="empty">No months in this period.</div>';
   return `<div class="hm" style="grid-template-columns:minmax(96px,1.4fr) repeat(${ms.length},minmax(0,1fr))"><div class="lb"></div>${ms.map(m => `<div class="lb" style="justify-content:center;color:var(--muted);min-height:20px">${mlab(m)}</div>`).join('')}${rows.map(r => `<div class="lb" style="${ST.rep && ST.rep !== r ? 'opacity:.35' : ''}">${avatar(r, 22)}<span style="margin-left:6px">${esc(r.split(' ')[0])}</span></div>${ms.map((m,i) => { const v = A.monthly[i+off][r] || 0; return `<div data-tip="<b>${esc(r)}</b><br>${mlab(m)} ${m.slice(0,4)}: ${money(v)}" style="background:${v > 0 ? `color-mix(in srgb,#0a4fe1 ${16+84*v/mx}%,transparent)` : 'var(--track)'};color:${v > 0 ? (v/mx > .45 ? '#fff' : '#011389') : 'var(--muted)'};${ST.rep && ST.rep !== r ? 'opacity:.3' : ''}">${v > 0 ? k$(v) : '–'}</div>`; }).join('')}`).join('')}</div>`; }},
 calendar:{t:'Order Calendar', sub:() => 'last 3 months', r(M){ const by = {}; [...groupOrders(M.doneAll), ...M.openOrders].forEach(o => { if(!o.date) return; const k = new Date(o.date).toDateString(); (by[k] ||= []).push(o); });
   const mx = Math.max(...Object.values(by).map(l => l.reduce((s,o) => s + o.val, 0)), 1), now = new Date();
   return `<div class="cal">${[2,1,0].map(back => { const Y = now.getFullYear(), Mo = now.getMonth() - back, f = new Date(Y, Mo, 1), nd = new Date(f.getFullYear(), f.getMonth()+1, 0).getDate(), off = (f.getDay()+6)%7; let c = '<span style="background:none"></span>'.repeat(off);
     for(let i = 1; i <= nd; i++){ const dd = new Date(f.getFullYear(), f.getMonth(), i), l = by[dd.toDateString()]; if(l){ const v = l.reduce((s,o) => s + o.val, 0), op = l.some(o => o.st !== 'Completed'); c += `<span class="x" style="background:${op ? '#f59e0b' : `color-mix(in srgb,#0a4fe1 ${35+65*v/mx}%,transparent)`}" data-tip="<b>${fdate(dd)}</b> · ${l.length} order${l.length > 1 ? 's' : ''}<br>${money(v)}${op ? '<br>includes an open order' : ''}">${i}</span>`; } else c += `<span>${i}</span>`; }
     return `<div><h6>${MN[f.getMonth()]} ${f.getFullYear()}</h6><div class="cg">${c}</div></div>`; }).join('')}</div>`; }},
 opp:{t:'Opportunity Map', sub:() => 'spend vs days since last order', r(M, opts2 = {}){ const ac = M.accts.filter(a => a.d !== null); if(!ac.length) return '<div class="empty">No accounts yet.</div>';
   const Wd = opts2.w || 560, H = opts2.h || 250, L = 46, B = 28, T = 12, R = 10, mY = Math.max(...ac.map(a => a.rev), 1)*1.2, x = v => L + (Wd-L-R)*Math.min(v, 120)/120, y = v => T + (H-T-B)*(1 - v/mY);
   let g = `<rect x="${x(60)}" y="${T}" width="${x(120)-x(60)}" height="${Math.max(y(Math.min(1000, mY))-T, 0)}" fill="#e5484d" opacity=".07" rx="8"/><text x="${x(120)-6}" y="${T+14}" text-anchor="end" font-size="10.5" font-weight="700" fill="#e5484d">Big And Going Quiet</text>`;
   [0,30,60,90,120].forEach(v => g += `<line class="gl" x1="${x(v)}" x2="${x(v)}" y1="${T}" y2="${H-B}"/><text class="ax" x="${x(v)}" y="${H-B+14}" text-anchor="middle">${v === 120 ? '120d+' : v + 'd'}</text>`);
   ac.forEach(a => g += `<circle cx="${x(a.d)}" cy="${y(a.rev)}" r="${Math.min(6 + a.orders*3, 18)}" fill="${RC[a.rep] || '#9aa1ad'}" fill-opacity=".8" stroke="#fff" stroke-width="2" style="cursor:pointer" data-act="acct" data-v="${esc(a.cust)}" data-tip="<b>${esc(a.cust)}</b><br>${money(a.rev)} · last order ${a.d} days ago"/>`);
   const svg = `<svg viewBox="0 0 ${Wd} ${H}" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">${g}</svg>`; return opts2.inner ? svg : `<div class="fit" data-chart="opp" style="height:100%">${svg}</div>`; }},
 pipeline:{t:'Order Pipeline', sub:() => 'open orders and this month\'s wins', r(M){ const tm = mkey(new Date());
   const col = (t, l, cl, e) => `<div class="kcol"><h5>${t}<span class="tag ${cl}">${l.length}</span></h5>${l.length ? l.map(o => `<div class="kc" style="border-left-color:${RC[o.rep] || '#9aa1ad'}" data-act="acct" data-v="${esc(o.cust)}"><b>${esc(o.no)}</b><div>${esc(o.cust)}</div><div class="m"><span>${esc(o.rep)}</span><b style="color:var(--ink)">${money(o.val)}</b></div>${o.st !== 'Completed' && o.date ? `<div class="m"><span>Added ${fdate(o.date)}</span><span class="tag ${daysSince(o.date) > 7 ? 'r' : 'a'}">${daysSince(o.date)} days</span></div>` : ''}</div>`).join('') : `<div class="empty">${e}</div>`}</div>`;
   return `<div class="kan">${col('Placed', M.openOrders.filter(o => o.st === 'Placed'), 'k', 'None right now')}${col('Parked', M.openOrders.filter(o => o.st === 'Parked'), 'a', 'None right now')}${col('Backordered', M.openOrders.filter(o => o.st === 'Backordered'), 'a', 'None right now')}${col('Completed · ' + MN[new Date().getMonth()], groupOrders(M.doneAll).filter(o => o.date && mkey(o.date) === tm), 'g', 'None yet')}</div>`; }},
};

/* ======================= render ======================= */
const app = document.getElementById('app');
function ageText(){ if(!IMPORTED_AT) return 'Loading…'; const m = Math.round((Date.now() - new Date(IMPORTED_AT))/6e4); return m < 60 ? `Live · ${m} min${m === 1 ? '' : 's'} ago` : m < 2880 ? `Live · ${Math.round(m/60)} hour${Math.round(m/60) === 1 ? '' : 's'} ago` : `Data ${Math.round(m/1440)} days old`; }
function render(anim){
  const M = LINES.length ? model() : null, items = LAYOUT.filter(x => !x.hidden);
  const nav = [['dashboard','Dashboard'],['accounts','Accounts'],['orders','Orders'],['products','Products / SKUs'],['reports','Reports']].map(([k,l]) => [k, l, '#' + k]);
  const P = PAGES[ST.page], dash = ST.page === 'dashboard';
  if(!dash) ST.edit = false;
  app.className = `app ${ST.edit ? 'editing' : ''} ${anim ? 'anim' : ''}`;
  const stale = IMPORTED_AT && (Date.now() - new Date(IMPORTED_AT)) > 14*864e5;
  app.innerHTML = `<nav class="nav"><div class="brand"><i></i><span>Sales Rep<br>Dashboard</span></div>${nav.map(([k,l,h]) => `<a class="${k === ST.page ? 'on' : ''}" href="${h}">${ico(k)}<span>${l}</span></a>`).join('')}
    <small>MORE VIEWS</small><a href="home.html">${ico('home')}<span>Rep Home</span></a><a href="history.html">${ico('history')}<span>History</span></a><span class="sp"></span><span class="div"></span><a data-act="signout">${ico('out')}<span>Sign Out</span></a></nav>
  <main class="body">
    <div class="head"><div><h2>${P.t}<span class="prevtag">New Design Preview</span></h2><p>${P.s}</p></div><span class="sp"></span>
      <span class="live ${stale || ST.loadErr ? 'stale' : ''}" title="${esc(ST.loadErr || (IMPORTED_AT ? 'Last upload ' + new Date(IMPORTED_AT).toLocaleString('en-AU') : ''))}"><b></b>${ST.loadErr ? 'Could Not Load Data' : ageText()}</span>
      ${dash ? `<button class="btn ${ST.edit ? 'amber' : 'dark'}" id="btnEdit" data-act="edit">${ST.edit ? '✓ Done' : '✎ Customise'}</button>` : ''}</div>
    ${filterBar()}
    <div class="editbar"><b>Customising your layout: drag ⠿ to move a panel, ✕ to hide it. It's saved in this browser.</b><button class="btn" data-act="drawer">＋ Panels</button><button class="btn" data-act="reset">Reset</button><button class="btn amber" data-act="edit">Done</button></div>
    ${!dash && M ? `<div class="${anim ? 'page-in' : ''}">${pageHTML(M)}</div>` : `<div class="grid" id="grid">${M ? items.map((it,i) => widgetHTML(it.id, it.w, it.h, i, M, ST.edit)).join('')
      : items.map((it,i) => `<div class="w" data-s="${it.w}" style="--w:${it.w};--h:${it.h};--i:${i}"><div class="wb">${ST.loadErr ? '<div class="empty">Could not load the data. Please refresh.</div>' : ''}</div></div>`).join('')}</div>`}
    <div class="bottomnav">${nav.map(([k,l,h]) => `<a class="${k === ST.page ? 'on' : ''}" href="${h}">${ico(k)}${l.split(' ')[0]}</a>`).join('')}</div>
  </main>`;
  fitCharts(M);
  if(anim){ countUp(); clearTimeout(render._t); render._t = setTimeout(() => app.classList.remove('anim'), 1600); } else countUp();
  wire();
}
// draw charts at the panel's real size so they fill it on any screen
function fitCharts(M){ if(!M) return; document.querySelectorAll('.fit').forEach(b => { const w = Math.round(b.clientWidth), h = Math.round(b.clientHeight); if(w < 120 || h < 100) return;
  if(b.dataset.chart === 'trend') b.innerHTML = trendChart(M, w, h); else if(b.dataset.chart === 'opp') b.innerHTML = W.opp.r(M, {w, h, inner:true}); }); }
let _rz; addEventListener('resize', () => { clearTimeout(_rz); _rz = setTimeout(() => { if(LINES.length) fitCharts(model()); }, 150); });
function countUp(){ app.querySelectorAll('[data-count]').forEach(el => { const to = +el.dataset.count, isM = el.dataset.fmt === 'money', t0 = performance.now(), dur = 800;
  const step = t => { const p = Math.min((t - t0)/dur, 1), e = 1 - Math.pow(1-p, 3), v = to*e; el.textContent = isM ? money(v) : Math.round(v); if(p < 1) requestAnimationFrame(step); }; requestAnimationFrame(step); }); }

/* ======================= the other pages: Accounts, Orders, Products / SKUs, Reports ======================= */
const PAGES = {
  dashboard:{t:'Sales Dashboard', s:'Your accounts, orders and SKUs at a glance'},
  accounts:{t:'Accounts', s:'Every account, who owns it and when it last ordered'},
  orders:{t:'Orders', s:'Every sales order, open orders first'},

const PAGE_KEYS = Object.keys(PAGES);
ST.page = PAGE_KEYS.includes(location.hash.slice(1)) ? location.hash.slice(1) : 'dashboard';
ST.acct = ''; ST.sort = {}; ST.pg = {}; ST.exp = new Set();

function goPage(p){ if(location.hash.slice(1) !== p) location.hash = p; else { ST.page = p; render(true); } }

const PAGE_SIZE = 25;
const statusTag = st => `<span class="tag ${st === 'Completed' ? 'g' : st === 'Placed' ? 'k' : st === 'Backordered' ? 'a' : 'n'}">${esc(st)}</span>`;
const repCell = r => `${avatar(r, 22)}<span style="margin-left:7px">${esc(r)}</span>`;
function tableCard(id, title, cols, rows, o = {}){
  const s = ST.sort[id] || o.sort || {k:null, dir:-1};
  const c = cols.find(x => x.k === s.k);
  if(c && c.sort) rows = rows.slice().sort((a,b) => { const x = c.sort(a), y = c.sort(b); if(x == null && y == null) return 0; if(x == null) return 1; if(y == null) return -1; return (x > y ? 1 : x < y ? -1 : 0) * s.dir; });
  const pages = Math.max(1, Math.ceil(rows.length / PAGE_SIZE)), pg = Math.min(ST.pg[id] || 0, pages - 1), view = rows.slice(pg*PAGE_SIZE, (pg+1)*PAGE_SIZE);
  const th = cols.map(c => `<th class="${c.num ? 'rt' : ''} ${c.sort ? 'srt' : ''}" ${c.sort ? `data-act="sort" data-v="${id}:${c.k}"` : ''}>${c.label}${c.sort ? ` <span class="ar ${s.k === c.k ? 'on' : ''}">${s.k === c.k ? (s.dir > 0 ? '▲' : '▼') : '↕'}</span>` : ''}</th>`).join('');
  const body = view.map(r => { const open = o.isOpen && o.isOpen(r);
    return `<tr class="${o.rowAct ? 'click' : ''} ${open ? 'opn' : ''}" ${o.rowAct ? `data-act="${o.rowAct}" data-v="${esc(o.rowVal(r))}"` : ''}>${cols.map(c => `<td class="${c.num ? 'rt' : ''} ${c.cls || ''}">${c.cell(r)}</td>`).join('')}</tr>${open ? `<tr class="exp"><td colspan="${cols.length}">${o.expand(r)}</td></tr>` : ''}`; }).join('');
  const pager = rows.length > PAGE_SIZE ? `<div class="pager"><span>Showing ${pg*PAGE_SIZE+1}–${Math.min((pg+1)*PAGE_SIZE, rows.length)} of ${rows.length}</span><span class="pgb"><button class="btn" data-act="pg" data-v="${id}:-1" ${pg === 0 ? 'disabled' : ''}>‹ Prev</button><span>Page ${pg+1} of ${pages}</span><button class="btn" data-act="pg" data-v="${id}:1" ${pg >= pages-1 ? 'disabled' : ''}>Next ›</button></span></div>` : '';
  return `<div class="tcard" style="--i:${o.i || 6}"><div class="wh"><h4>${title}</h4>${o.tools || ''}<small>${rows.length} ${o.noun || 'row'}${rows.length === 1 ? '' : 's'}${o.hint ? ' · ' + o.hint : ''}</small></div>
    <div class="tscroll"><table class="t big"><thead><tr>${th}</tr></thead><tbody>${body || `<tr><td colspan="${cols.length}"><div class="empty">${o.empty || 'Nothing matches the current filters.'}</div></td></tr>`}</tbody></table></div>${pager}</div>`;
}
function widgetHTML(id, w, h, i, M, editable){

}
const gridHTML = (items, M, start = 0) => `<div class="grid">${items.map(([id,w,h], i) => widgetHTML(id, w, h, start + i, M, false)).join('')}</div>`;

  k_skus:{t:'Products Sold', sub:() => 'different SKUs', r(M){ const p = new Map(); M.done.forEach(l => { if(cv(l.product_code) && (!ST.prod || isProduct(l.product_code))) p.set(l.product_code, (p.get(l.product_code) || 0) + (l.quantity || 0)); }); const u = [...p.values()].reduce((a,b) => a + b, 0);

    const rows = [...p].sort((a,b) => Object.values(b[1]).reduce((x,y) => x+y, 0) - Object.values(a[1]).reduce((x,y) => x+y, 0)).slice(0, 12), reps = M.reps.filter(r => rows.some(([,m]) => m[r])), mx = Math.max(...rows.flatMap(([,m]) => Object.values(m)), 1);
    if(!rows.length) return '<div class="empty">No products sold in this period.</div>';

  month_cmp:{t:'This Month vs Last Month', sub:() => 'completed sales, whatever the date range', r(M){ const ch = M.lastM ? (M.thisM - M.lastM) / M.lastM * 100 : null, n = new Date();
    const cell = (l, v, s) => `<div style="flex:1;min-width:140px"><div style="font-size:11.5px;color:var(--ink2)">${l}</div><div style="font-size:22px;font-weight:800">${v}</div><div style="font-size:11px;color:var(--muted)">${s}</div></div>`;
    return `<div style="display:flex;gap:16px;flex-wrap:wrap;align-items:center;height:100%">${cell(MN[n.getMonth()] + ' To Date', money(M.thisM), 'so far this month')}${cell(MN[(n.getMonth()+11)%12], money(M.lastM), 'whole month')}${cell('Change', ch === null ? '—' : `<span class="${ch >= 0 ? 'up' : 'down'}">${ch >= 0 ? '▲' : '▼'} ${Math.abs(ch).toFixed(0)}%</span>`, 'this month so far vs last month')}${cell('Selected Period', money(M.total), RLABEL())}</div>`; }},

});

function pageHTML(M){

    const tier = new Map(), pays = new Map();
    for(const l of M.base){ const t = cv(l.sell_price_tier), p = cv(l.payment_mode), d = dateOf(l) || '';

    const openBy = new Map(); M.openOrders.forEach(o => openBy.set(o.cust, (openBy.get(o.cust) || 0) + 1));
    const rows = M.accts.map(a => ({...a, tier:(tier.get(a.cust) || [''])[0], pay:[...(pays.get(a.cust) || [])].join(' · '), open:openBy.get(a.cust) || 0}));

    ${hasPay ? sel('fPay','Payment Mode', opts('All Payment Modes', uniq(l => cv(l.payment_mode) || U), ST.pay), 'fsec') : ''}
    ${sel('fType','Customer Type', opts('All Customer Types', uniq(l => cv(l.customer_type) || U), ST.type), 'fsec')}
    ${sel('fOst','Order Status', OST.map(([v,t]) => `<option value="${v}" ${ST.ost === v ? 'selected' : ''}>${t}</option>`).join(''), 'fsec')}
    ${CUSTOMERS.length ? sel('fAct','Accounts', ACT.map(([v,t]) => `<option value="${v}" ${ST.act === v ? 'selected' : ''}>${t}</option>`).join(''), 'fsec') : ''}
    ${hasTier ? sel('fTier','Sell Price Tier', opts('All Sell Price Tiers', uniq(l => cv(l.sell_price_tier) || U), ST.tier), 'fsec') : ''}
    <label class="fctl fsec"><small>Products / SKUs</small><span class="chk"><input type="checkbox" id="fProd" ${ST.prod ? 'checked' : ''}> Product Lines Only</span></label>
  </div>`;
  const c = [], add = (k, l, v) => c.push(`<span class="fchip"><small>${l}</small>${esc(v)}<button type="button" data-act="clear" data-v="${k}" aria-label="Remove ${l} filter">×</button></span>`);
  if(ST.rep) add('rep', 'Rep', ST.rep);
  if(ST.acct) add('acct', 'Account', ST.acct);
  if(ST.range !== 'all') add('range', 'Date', ST.range === 'custom' ? (ST.from ? fdate(ST.from + 'T00:00:00') : '…') + ' → ' + (ST.to ? fdate(ST.to + 'T00:00:00') : '…') : RLABEL());
  if(ST.wh) add('wh', 'Warehouse', ST.wh); if(ST.pay) add('pay', 'Payment', ST.pay); if(ST.type) add('type', 'Type', ST.type);
  if(ST.ost) add('ost', 'Status', OST.find(o => o[0] === ST.ost)[1]); if(ST.act) add('act', 'Accounts', ACT.find(o => o[0] === ST.act)[1]);
  if(ST.tier) add('tier', 'Tier', ST.tier); if(ST.q.trim()) add('q', 'Search', '"' + ST.q.trim() + '"'); if(ST.prod) add('prod', 'SKUs', 'Product Lines Only');
  return bar + `<div class="chips">${c.length ? `<span class="lbl">Active Filters:</span>${c.join('')}${c.length > 1 ? '<button type="button" class="clearall" data-act="clear" data-v="all">Clear All</button>' : ''}` : '<span class="lbl">No Filters, Showing Everything</span>'}</div>`;
}
function clearFilter(k){
  if(k === 'all') Object.assign(ST, {acct:'', pg:{}, rep:'', range:'all', from:'', to:'', wh:'', pay:'', type:'', tier:'', ost:'', act:'', prod:false, q:''});
  else if(k === 'range'){ ST.range = 'all'; ST.from = ''; ST.to = ''; } else if(k === 'prod') ST.prod = false; else ST[k] = '';
  ST.pg = {}; if(k === 'all' || k === 'rep') saveRep(); render(true);
}

/* ---------- account panel ---------- */
function openAccount(name){
  const ls = LINES.filter(l => l.customer === name); if(!ls.length) return;
  const done = groupOrders(ls.filter(isDone)).sort((a,b) => a.date < b.date ? 1 : -1), open = groupOrders(ls.filter(isOpenL));
  const rev = done.reduce((s,o) => s + o.val, 0), last = done[0]?.date, d = last ? daysSince(last) : null, h = d === null ? ['No Orders Yet','n'] : health(d), rep = repOf(ls[0]);
  const sku = new Map(); ls.filter(l => isDone(l) && isProduct(l.product_code)).forEach(l => sku.set(l.product_code, (sku.get(l.product_code)||0) + (l.quantity||0)));
  const tier = cv(ls.find(l => cv(l.sell_price_tier))?.sell_price_tier), pay = cv(ls.find(l => cv(l.payment_mode))?.payment_mode);
  document.getElementById('panel').innerHTML = `<div style="display:flex;gap:10px;align-items:flex-start"><div style="flex:1;min-width:0"><h3>${esc(name)}</h3><div style="font-size:12px;color:var(--muted);margin-top:3px">${avatar(rep, 18)} ${esc(rep)}${ls[0].customer_code ? ' · ' + esc(ls[0].customer_code) : ''}</div></div><button class="x" data-act="close" aria-label="Close">✕</button></div>
   <div style="margin-top:10px;display:flex;gap:6px;flex-wrap:wrap"><span class="tag ${h[1]}">${d === null ? h[0] : h[0] + ' · ' + d + ' days since last order'}</span>${tier ? `<span class="tag k">${esc(tier)}</span>` : ''}${pay ? `<span class="tag k">${esc(pay)}</span>` : ''}</div>
   <div class="minik"><div><small>Total Purchase</small><b>${money(rev)}</b></div><div><small>Orders</small><b>${done.length}</b></div><div><small>Avg Order</small><b>${done.length ? money(rev/done.length) : '—'}</b></div></div>
   <h4 style="margin:6px 0 4px;font-size:13px">Orders</h4><table class="t"><thead><tr><th>Date</th><th>Order No.</th><th>Status</th><th class="rt">Total</th></tr></thead><tbody>${[...open, ...done].map(o => `<tr><td>${fdate(o.date)}</td><td>${esc(o.no)}</td><td><span class="tag ${o.st === 'Completed' ? 'g' : 'a'}">${esc(o.st)}</span></td><td class="rt">${money(o.val)}</td></tr>`).join('')}</tbody></table>
   ${sku.size ? `<h4 style="margin:16px 0 6px;font-size:13px">Top SKUs</h4>${[...sku].sort((a,b) => b[1]-a[1]).slice(0,6).map(([k,u]) => `<div style="display:flex;justify-content:space-between;font-size:12px;padding:5px 0;border-bottom:1px solid var(--grid)"><span>${esc(k)}</span><b>${u} sold</b></div>`).join('')}` : ''}
   <p style="margin-top:16px"><button class="btn dark" data-act="acctorders" data-v="${esc(name)}">View All Orders →</button></p>`;
  showPanel(true);
}
function openDrawer(){
  document.getElementById('panel').innerHTML = `<div style="display:flex;justify-content:space-between;align-items:center"><h3>Panels</h3><button class="x" data-act="close">✕</button></div><p style="color:var(--ink2);font-size:12.5px;margin:4px 0 14px">Turn panels on or off and pick a width. Saved in this browser.</p>
   ${LAYOUT.map(x => `<div class="wl"><span>${W[x.id].t}</span><span class="sizes">${SIZES.map(s => `<button class="${x.w === s ? 'on' : ''}" data-act="size" data-v="${x.id}:${s}" title="Width ${s} of 12">${s}</button>`).join('')}</span><button class="tg ${x.hidden ? '' : 'on'}" data-act="toggle" data-v="${x.id}" aria-label="Show ${W[x.id].t}"></button></div>`).join('')}
   <div style="display:flex;gap:8px;margin-top:12px"><button class="btn" style="flex:1" data-act="reset">Reset Layout</button><button class="btn amber" style="flex:1" data-act="close">Done</button></div>`;
  showPanel(true);
}
function showPanel(on){ document.getElementById('panel').classList.toggle('open', on); document.getElementById('scrim').classList.toggle('open', on); ST.drawer = on && ST.edit; }

/* ---------- drag to reorder (Customise) ---------- */
let dragId = null;
function wire(){
  const q = document.getElementById('q'); if(q) q.oninput = e => { ST.q = e.target.value; clearTimeout(wire._t); wire._t = setTimeout(() => { ST.pg = {}; const pos = q.selectionStart; render(); const n = document.getElementById('q'); n.focus(); n.setSelectionRange(pos, pos); }, 180); };
  const on = (id, f) => { const el = document.getElementById(id); if(el) el.onchange = e => { f(e.target); ST.pg = {}; render(true); }; };
  on('fRep', t => { ST.rep = t.value; saveRep(); }); on('fRange', t => { ST.range = t.value; }); on('fFrom', t => { ST.from = t.value; }); on('fTo', t => { ST.to = t.value; });
  on('fWh', t => { ST.wh = t.value; }); on('fPay', t => { ST.pay = t.value; }); on('fType', t => { ST.type = t.value; }); on('fOst', t => { ST.ost = t.value; });
  on('fAct', t => { ST.act = t.value; }); on('fTier', t => { ST.tier = t.value; }); on('fProd', t => { ST.prod = t.checked; });
  if(!ST.edit) return;
  document.querySelectorAll('#grid .w').forEach(w => {
    const hd = w.querySelector('.handle'); if(hd){ hd.addEventListener('pointerdown', () => { w.draggable = true; }); hd.addEventListener('pointerup', () => { w.draggable = false; }); }
    w.addEventListener('dragstart', e => { dragId = w.dataset.id; w.classList.add('dragging'); e.dataTransfer.effectAllowed = 'move'; try { e.dataTransfer.setData('text/plain', dragId); } catch(_){} });
    w.addEventListener('dragend', () => { w.draggable = false; w.classList.remove('dragging'); document.querySelectorAll('.drop-before,.drop-after').forEach(x => x.classList.remove('drop-before','drop-after')); });
    w.addEventListener('dragover', e => { if(!dragId || w.dataset.id === dragId) return; e.preventDefault(); const r = w.getBoundingClientRect(), after = e.clientX > r.left + r.width/2; w.classList.toggle('drop-after', after); w.classList.toggle('drop-before', !after); });
    w.addEventListener('dragleave', () => w.classList.remove('drop-before','drop-after'));
    w.addEventListener('drop', e => { e.preventDefault(); if(!dragId || w.dataset.id === dragId) return; const after = w.classList.contains('drop-after'); const from = LAYOUT.findIndex(x => x.id === dragId), it = LAYOUT.splice(from, 1)[0]; let to = LAYOUT.findIndex(x => x.id === w.dataset.id); if(after) to++; LAYOUT.splice(to, 0, it); dragId = null; saveLayout(); render(); });
  });
}
document.addEventListener('click', e => {
  if(e.target.id === 'scrim'){ showPanel(false); return; }
  const a = e.target.closest('[data-act]'); if(!a) return; const k = a.dataset.act, v = a.dataset.v;
  if(k === 'rep'){ ST.rep = ST.rep === v ? '' : v; saveRep(); render(); }
  else if(k === 'sort'){ const [id, col] = v.split(':'), cur = ST.sort[id]; ST.sort[id] = {k:col, dir: cur && cur.k === col ? -cur.dir : -1}; ST.pg[id] = 0; render(); }
  else if(k === 'pg'){ const [id, d] = v.split(':'); ST.pg[id] = Math.max(0, (ST.pg[id] || 0) + (+d)); render(); document.querySelector('.tcard')?.scrollIntoView({block:'start', behavior:'smooth'}); }
  else if(k === 'exp'){ ST.exp.has(v) ? ST.exp.delete(v) : ST.exp.add(v); render(); }
  else if(k === 'ost'){ ST.ost = v; ST.pg = {}; render(); }
  else if(k === 'acctorders'){ ST.acct = v; ST.pg = {}; showPanel(false); goPage('orders'); }
  else if(k === 'more'){ ST.more = !ST.more; render(); }
  else if(k === 'clear'){ clearFilter(v); }
  else if(k === 'trend'){ ST.trend = v; render(true); }
  else if(k === 'acctF'){ ST.acctF = v; render(); }
  else if(k === 'acct'){ openAccount(v); }
  else if(k === 'close'){ showPanel(false); }
  else if(k === 'edit'){ ST.edit = !ST.edit; showPanel(false); render(); }
  else if(k === 'drawer'){ openDrawer(); }
  else if(k === 'hide'){ LAYOUT.find(x => x.id === v).hidden = true; saveLayout(); render(); }
  else if(k === 'toggle'){ const it = LAYOUT.find(x => x.id === v); it.hidden = !it.hidden; saveLayout(); render(); openDrawer(); }
  else if(k === 'size'){ const [id, s] = v.split(':'); LAYOUT.find(x => x.id === id).w = +s; saveLayout(); render(); openDrawer(); }
  else if(k === 'reset'){ LAYOUT = defaultLayout(); saveLayout(); render(true); if(document.getElementById('panel').classList.contains('open')) openDrawer(); }
  else if(k === 'signout'){ try { localStorage.removeItem(AUTH_KEY); } catch(_){} location.reload(); }
});
document.addEventListener('keydown', e => { if(e.key === 'Escape') showPanel(false); });
const tip = document.getElementById('tip');
document.addEventListener('mousemove', e => { const t = e.target.closest('[data-tip]'); if(!t){ tip.style.display = 'none'; return; } tip.innerHTML = t.dataset.tip; tip.style.display = 'block'; tip.style.left = Math.min(e.clientX + 14, innerWidth - tip.offsetWidth - 8) + 'px'; tip.style.top = Math.min(e.clientY + 14, innerHeight - tip.offsetHeight - 8) + 'px'; });
setInterval(() => { const el = document.querySelector('.live'); if(el && IMPORTED_AT && !ST.loadErr) el.lastChild.textContent = ageText(); }, 60000);

/* ======================= sign in (same password as the other pages) ======================= */
async function sha256Hex(t){ const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(t)); return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2,'0')).join(''); }
(function(){
  let ok = false; try { ok = localStorage.getItem(AUTH_KEY) === AUTH_HASH; } catch(_){}
  const gate = document.getElementById('auth');
  if(ok){ gate.hidden = true; load(); return; }
  document.getElementById('pw').focus();
  document.getElementById('authForm').addEventListener('submit', async e => { e.preventDefault(); const v = document.getElementById('pw').value, err = document.getElementById('authErr');
    if(!v){ err.textContent = 'Enter the password.'; return; }
    if(await sha256Hex(v) === AUTH_HASH){ try { localStorage.setItem(AUTH_KEY, AUTH_HASH); } catch(_){} gate.hidden = true; load(); }
    else { err.textContent = 'Incorrect password.'; document.getElementById('pw').value = ''; } });
})();
</script></body></html>
