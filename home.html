<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sales Rep Home</title>
<style>
  :root{
    --ink-primary:#1a2233;
    --ink-secondary:#5b6577;
    --ink-muted:#8a93a3;
    --surface:#f4f6fa;
    --surface-card:#ffffff;
    --border:#e4e7ec;
    --brand:#2a78d6;
    --brand-dark:#1c5cab;
    --good:#0ca30c;
    --radius:12px;
    --sidebar-w:224px;
    --sidebar-bg:#0e1830;
    --sidebar-text:#93a1c0;
    --sidebar-text-active:#ffffff;
    --sidebar-active-bg:#1c3f73;
    /* categorical slots — fixed order, never reassigned by filters */
    --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100;
    --s5:#e87ba4; --s6:#008300; --s7:#4a3aa7; --s8:#e34948;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--surface);
    color:var(--ink-primary);
  }

  /* ---------- Sidebar ---------- */
  .sidebar{
    position:fixed; top:0; left:0; bottom:0; width:var(--sidebar-w);
    background:var(--sidebar-bg); display:flex; flex-direction:column;
    padding:20px 12px; z-index:20;
  }
  .sidebar-logo{color:#fff; display:flex; align-items:center; gap:8px; padding:4px 10px 22px; font-weight:700; font-size:15px;}
  .sidebar-logo svg{flex-shrink:0;}
  .nav-group{display:flex; flex-direction:column; gap:2px;}
  .nav-item{
    display:flex; align-items:center; gap:10px; padding:9px 12px; border-radius:8px;
    color:var(--sidebar-text); font-size:13.5px; font-weight:600; cursor:pointer; border:none; background:none;
    text-align:left; width:100%; font-family:inherit;
  }
  .nav-item svg{flex-shrink:0; opacity:.85;}
  .nav-item:hover{color:#fff; background:rgba(255,255,255,.06);}
  .nav-item.active{color:var(--sidebar-text-active); background:var(--sidebar-active-bg);}
  .nav-divider{border-top:1px solid rgba(255,255,255,.09); margin:14px 4px;}
  .nav-footer{margin-top:auto; display:flex; flex-direction:column; gap:2px;}

  .app{margin-left:var(--sidebar-w);}
  .wrap{max-width:1280px;margin:0 auto;padding:24px 28px 60px;}

  .top{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:20px;flex-wrap:wrap;}
  h1{font-size:21px;margin:0 0 4px;letter-spacing:-0.01em;}
  .subtitle{color:var(--ink-secondary);font-size:13.5px;margin:0;}
  .status-pill{
    display:inline-flex;align-items:center;gap:6px;flex-shrink:0;
    background:#eef6ee;color:#1a6b2f;border:1px solid #cfe8d2;
    padding:5px 12px;border-radius:100px;font-size:12.5px;font-weight:600;
  }
  .status-pill .dot{width:6px;height:6px;border-radius:50%;background:var(--good);}
  .status-pill.stale{background:#fff4e0;color:#8a5b00;border-color:#f0d59a;}
  .status-pill.stale .dot{background:#c98a05;}
  .top-actions{display:flex;align-items:center;gap:10px;flex-shrink:0;flex-wrap:wrap;}
  .btn{
    appearance:none;border:1px solid var(--border);background:#fff;color:var(--ink-primary);
    padding:7px 13px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px;
  }
  .btn:hover{border-color:#c7ceda;}
  .btn-primary{border-color:var(--brand);background:var(--brand);color:#fff;}
  .btn-primary:hover{background:var(--brand-dark);}
  .btn:disabled{opacity:.6;cursor:default;}
  .import-msg{font-size:12.5px;margin:-12px 0 14px;min-height:1em;}
  .import-msg.ok{color:var(--good);}
  .import-msg.err{color:#c0392b;}
  .import-msg.busy{color:var(--ink-secondary);}

  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:20px;}
  .stat-card{background:var(--surface-card);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;display:flex;gap:12px;align-items:flex-start;}
  .stat-icon{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .stat-label{font-size:12px;color:var(--ink-muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em;margin-bottom:6px;}
  .stat-value{font-size:22px;font-weight:700;letter-spacing:-0.02em;}
  .stat-sub{font-size:12.5px;color:var(--ink-secondary);margin-top:4px;}

  .toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:16px;}
  .toolbar select, .toolbar input[type="text"]{
    border:1px solid var(--border);background:#fff;border-radius:8px;padding:8px 12px;font-size:13.5px;color:var(--ink-primary);min-width:150px;
  }
  .toolbar input[type="text"]{min-width:210px;}
  .toolbar input.date-input{min-width:0;padding:8px 10px;}
  .toolbar .grow{flex:1;}
  .toolbar .result-count{font-size:12.5px;color:var(--ink-muted);white-space:nowrap;}
  .chk{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--ink-secondary);cursor:pointer;}
  .chk input{cursor:pointer;}
  .chk-hint{color:var(--ink-muted);font-size:12px;}

  .card{background:var(--surface-card);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;}
  .card-head{padding:16px 18px 4px;display:flex;align-items:baseline;justify-content:space-between;gap:10px;}
  .card-head h2{font-size:15px;margin:0;}
  .card-head .count{font-size:12.5px;color:var(--ink-muted);white-space:nowrap;}
  .card-link{font-size:12.5px;font-weight:600;color:var(--brand);text-decoration:none;cursor:pointer;white-space:nowrap;}
  .card-link:hover{text-decoration:underline;}

  .table-scroll{max-height:560px;overflow:auto;}
  table{width:100%;border-collapse:collapse;font-size:13.5px;}
  thead th{position:sticky;top:0;background:var(--surface-card);text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-muted);font-weight:700;padding:10px 18px;border-bottom:1px solid var(--border);white-space:nowrap;cursor:default;}
  thead th.num, tbody td.num{text-align:right;}
  tbody td{padding:11px 18px;border-bottom:1px solid var(--border);white-space:nowrap;}
  tbody tr:last-child td{border-bottom:none;}
  tbody tr:hover{background:#fafbfc;}
  tbody tr.clickable{cursor:pointer;}
  tbody tr.clickable:hover{background:#eef4fc;}
  tbody tr.row-selected{background:#e8f1fc;}
  .rep-name{font-weight:600;}
  .rep-email{color:var(--ink-muted);font-size:12px;display:block;font-weight:400;}
  .rep-dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:7px;flex-shrink:0;vertical-align:middle;}
  .badge{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:100px;background:#e8f6ee;color:var(--good);}
  .badge .idot{width:5px;height:5px;border-radius:50%;background:currentColor;}
  /* Sell Price Tier / Payment Mode tags */
  .tbl-compact thead th, .tbl-compact tbody td{padding-left:10px;padding-right:10px;}
  .tag{display:inline-flex;align-items:center;font-size:12px;font-weight:600;padding:2px 9px;border-radius:100px;white-space:nowrap;}
  .tag-tier{background:#e8f1fc;color:var(--brand-dark);}
  .tag-pay{background:#f1f3f7;color:var(--ink-secondary);}
  .tag-more{padding:2px 2px;color:var(--ink-muted);}
  .tag-none{color:var(--ink-muted);}
  .tag-wrap{display:inline-flex;align-items:center;gap:4px;}
  .acct-selected-chips{display:flex;gap:18px;flex-wrap:wrap;align-items:center;margin:-6px 0 14px;}
  .acct-selected-chips:empty{display:none;}
  .chip-pair{display:inline-flex;align-items:center;gap:7px;font-size:12px;color:var(--ink-muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em;}
  .chip-pair .tag{text-transform:none;letter-spacing:0;}
  .feed-note{margin:0 0 16px;}
  .mix-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px;margin-bottom:18px;align-items:start;}
  .empty-row td{color:var(--ink-muted);text-align:center;padding:30px 18px;}
  .row-chevron{color:var(--ink-muted);float:right;}

  .two-col{display:grid;grid-template-columns:1.3fr 1fr;gap:16px;margin-bottom:18px;align-items:start;}
  @media (max-width: 1000px){ .stats{grid-template-columns:repeat(2,1fr);} .two-col{grid-template-columns:1fr;} .dash-layout{grid-template-columns:1fr !important;} }
  @media (max-width: 820px){ .app{margin-left:0;} }

  .chart-card{padding:18px;}
  .chart-scroll{max-height:400px;overflow-y:auto;}
  .chart-row{margin-bottom:13px;}
  .chart-row:last-child{margin-bottom:0;}
  .chart-top{display:flex;align-items:baseline;justify-content:space-between;gap:14px;margin-bottom:5px;}
  .chart-label{flex:1;min-width:0;font-size:12.5px;font-weight:600;color:var(--ink-secondary);word-break:break-word;line-height:1.35;display:flex;align-items:center;gap:6px;}
  .chart-label .rep-dot{flex-shrink:0;}
  .chart-value{flex-shrink:0;font-size:12.5px;font-weight:700;white-space:nowrap;color:var(--ink-primary);text-align:right;}
  .chart-value-sub{display:block;font-weight:400;color:var(--ink-muted);font-size:11px;}
  .chart-track{background:#eef0f3;border-radius:4px;height:14px;position:relative;overflow:hidden;}
  .chart-fill{height:100%;border-radius:4px;}

  .note{margin-top:20px;padding:12px 16px;border:1px dashed #c9d3e0;border-radius:10px;font-size:12.5px;color:var(--ink-secondary);background:#f8f9fb;}
  .note b{color:var(--ink-primary);}
  th.sortable{cursor:pointer;user-select:none;}
  th.sortable:hover{color:var(--ink-secondary);}
  th.sortable .arrow{opacity:.4;margin-left:3px;}
  th.sortable.active .arrow{opacity:1;color:var(--brand);}

  /* ---------- Dashboard page layout ---------- */
  .dash-layout{display:grid;grid-template-columns:230px 1fr;gap:16px;align-items:start;margin-bottom:16px;}
  .bdm-panel{background:var(--surface-card);border:1px solid var(--border);border-radius:var(--radius);padding:14px;}
  .bdm-panel-title{font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-muted);font-weight:700;margin:0 0 10px;}
  .bdm-search{width:100%;border:1px solid var(--border);border-radius:8px;padding:7px 10px;font-size:13px;margin-bottom:10px;}
  .bdm-list{display:flex;flex-direction:column;gap:2px;max-height:420px;overflow-y:auto;}
  .bdm-item{display:flex;align-items:center;gap:8px;padding:9px 10px;border-radius:8px;cursor:pointer;font-size:13.5px;font-weight:600;color:var(--ink-secondary);}
  .bdm-item:hover{background:#f2f4f8;}
  .bdm-item.active{background:#e8f1fc;color:var(--brand-dark);}
  .bdm-list-sm{max-height:150px;}
  .dash-main-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:12px;flex-wrap:wrap;}
  .dash-main-head h2{font-size:16px;margin:0;}
  .dash-main-head h2 b{color:var(--brand-dark);}
  .dash-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;}
  @media (max-width:700px){ .dash-stats{grid-template-columns:1fr;} }
  .acct-selected-label{font-size:12px;color:var(--ink-muted);text-transform:uppercase;letter-spacing:.04em;font-weight:700;margin:0 0 2px;}
  .acct-selected-name{font-size:17px;font-weight:700;color:var(--brand-dark);margin:0 0 14px;}

  .filter-overlay{position:fixed;inset:0;background:rgba(15,20,35,.35);z-index:40;display:none;align-items:flex-start;justify-content:flex-start;}
  .filter-overlay.open{display:flex;}
  .filter-panel{background:#fff;width:320px;height:100%;padding:22px;box-shadow:8px 0 24px rgba(0,0,0,.12);display:flex;flex-direction:column;gap:14px;overflow-y:auto;}
  .filter-panel h3{margin:0 0 4px;font-size:16px;}
  .filter-field label{display:block;font-size:12px;font-weight:700;color:var(--ink-muted);text-transform:uppercase;letter-spacing:.03em;margin-bottom:6px;}
  .filter-field select, .filter-field input[type="text"]{width:100%;}
  .filter-close{margin-left:auto;border:none;background:none;font-size:20px;line-height:1;cursor:pointer;color:var(--ink-muted);}

  /* ---------- Sign-in gate ---------- */
  /* Font + sizing matched to the DDL Product Price & Stock dashboard's login card */
  
  .auth-overlay{
    position:fixed; inset:0; z-index:100; background:var(--surface);
    display:flex; align-items:center; justify-content:center; padding:24px;
    font-family:'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  .auth-card{
    box-sizing:border-box;
    width:100%; max-width:360px; background:var(--surface-card); border:1px solid var(--border);
    border-radius:16px; padding:32px 28px; box-shadow:0 8px 40px rgba(0,0,0,.14);
  }
  .auth-title{color:var(--ink-primary); font-size:19px; font-weight:600; margin:0 0 4px;}
  .auth-sub{color:var(--ink-secondary); font-size:13px; margin:0 0 24px; line-height:1.4;}
  .auth-field label{display:block; color:var(--ink-secondary); font-size:12px; margin:0 0 6px;}
  .auth-input-wrap{position:relative; display:flex; align-items:center; margin-bottom:16px;}
  .auth-input-wrap input{
    width:100%; box-sizing:border-box; background:var(--surface); border:1px solid var(--border); color:var(--ink-primary);
    border-radius:8px; padding:10px 40px 10px 12px; font-size:14px; font-family:inherit;
  }
  .auth-input-wrap input:focus{outline:none; border-color:#007aff;}
  .auth-toggle{
    position:absolute; right:6px; border:none; background:none; color:var(--ink-muted);
    cursor:pointer; padding:6px; display:flex; align-items:center; border-radius:6px;
  }
  .auth-toggle:hover{color:var(--ink-primary); background:rgba(0,0,0,.05);}
  .auth-btn{
    width:100%; background:#007aff; color:#fff; border:none; border-radius:8px;
    padding:11px; font-size:14px; font-weight:600; cursor:pointer; font-family:inherit;
  }
  .auth-btn:hover{background:#0060df;}
  .auth-btn:disabled{opacity:.6; cursor:default;}
  .auth-error{color:#ff3b30; font-size:12.5px; margin:12px 0 0; min-height:17px;}
  .auth-overlay[hidden]{display:none;}

  /* ---------- History page additions ---------- */
  .muted{color:var(--ink-muted);}
  .up{color:#0a8a4a;font-weight:700;} .down{color:#c0392b;font-weight:700;}
  .fbar{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;margin-bottom:10px;}
  .fsel{display:flex;flex-direction:column;gap:4px;font-size:11.5px;}
  .fsel b{color:var(--ink-muted);text-transform:uppercase;letter-spacing:.04em;font-size:11px;}
  .fsel select{border:1px solid var(--border);background:#fff;border-radius:8px;padding:8px 10px;font-size:13.5px;color:var(--ink-primary);min-width:150px;font-family:inherit;}
  .seg{display:inline-flex;border:1px solid var(--border);border-radius:8px;overflow:hidden;background:#fff;}
  .seg button{border:none;background:#fff;padding:8px 13px;font-size:13px;font-weight:600;color:var(--ink-secondary);cursor:pointer;font-family:inherit;border-right:1px solid var(--border);}
  .seg button:last-child{border-right:none;}
  .seg button.on{background:#e8f1fc;color:var(--brand-dark);}
  .infobar{display:flex;gap:8px;align-items:flex-start;background:#eef4fc;border:1px solid #d6e4f7;color:#2c4a73;border-radius:10px;padding:9px 13px;font-size:12.5px;line-height:1.45;margin-bottom:16px;}
  .why{margin-top:12px;background:#fff8ef;border:1px solid #f3dcbc;border-radius:10px;padding:11px 14px;font-size:13.5px;line-height:1.5;color:#5b4326;}
  .hero-big{font-size:34px;font-weight:700;letter-spacing:-0.02em;}
  .hero-big.down{color:#c0392b;} .hero-big.up{color:#0a8a4a;}
  .hero-sub{font-size:13.5px;color:var(--ink-secondary);margin-top:4px;}
  .legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-secondary);margin-bottom:8px;}
  .legend i{display:inline-block;width:12px;height:4px;border-radius:2px;margin-right:6px;vertical-align:middle;}
  .rowbar{display:grid;grid-template-columns:130px 1fr auto;gap:12px;align-items:center;margin-bottom:12px;font-size:12.5px;}
  .rowbar .lab{font-weight:600;color:var(--ink-secondary);word-break:break-word;}
  .rowbar .pair{position:relative;height:22px;}
  .rowbar .pair div{position:absolute;left:0;height:10px;border-radius:3px;}
  .badge-lost{display:inline-block;background:#fdecea;color:#c0392b;font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:100px;}
  .sel-trend{display:grid;grid-template-columns:1.3fr 1fr;gap:16px;align-items:start;margin-bottom:18px;}
  @media (max-width:1000px){.sel-trend{grid-template-columns:1fr;}}
  .kv{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
  .kv>div{background:var(--surface-card);border:1px solid var(--border);border-radius:10px;padding:10px 12px;}
  .kv small{display:block;font-size:11px;color:var(--ink-muted);font-weight:700;text-transform:uppercase;letter-spacing:.03em;margin-bottom:4px;}
  .kv strong{font-size:14.5px;}
  .lk{display:block;font-size:11.5px;color:var(--ink-muted);font-weight:400;}
  th.hl,td.hl{background:#f6f9fe;}
  .mini-note{font-size:12px;color:var(--ink-muted);margin:18px 0 0;line-height:1.5;}
  .hit:hover{fill:rgba(42,120,214,.07);}
  .rowbar:hover{background:#f6f9fe;}
  #tip{position:fixed;display:none;z-index:60;pointer-events:none;background:#1a2233;color:#fff;font-size:12.5px;padding:8px 11px;border-radius:8px;white-space:pre-line;line-height:1.5;max-width:300px;box-shadow:0 4px 16px rgba(0,0,0,.25);}
  .menu-btn{display:none;}
  @media (max-width:820px){
    .menu-btn{display:inline-flex;}
    .sidebar{display:flex;transform:translateX(-100%);transition:transform .2s;}
    .sidebar.open{transform:none;box-shadow:8px 0 24px rgba(0,0,0,.3);}
    .wrap{padding:16px 14px 50px;}
    .stats{grid-template-columns:repeat(2,1fr);}
    .kv{grid-template-columns:repeat(2,1fr);}
    .rowbar{grid-template-columns:90px 1fr;} .rowbar>div:last-child{grid-column:1/-1;}
    .fsel select{min-width:0;width:100%;} .fsel{flex:1 1 140px;}
    .stats[style]{grid-template-columns:1fr !important;} .two-col[style]{grid-template-columns:1fr !important;}
  }
  .tbl-compact td:first-child{white-space:normal;min-width:170px;max-width:250px;}
  .tbl-compact .rep-name{white-space:normal;}
  .tbl-compact thead th, .tbl-compact tbody td{padding-left:8px;padding-right:8px;}
  @media (max-width:820px){ .chart-card{overflow-x:auto;} .chart-card svg{min-width:620px;} }

  .wrap{max-width:1320px;}
  .up{color:#0a8a4a;font-weight:700;} .down{color:#c0392b;font-weight:700;} .muted{color:var(--ink-muted);}
  .topbar{display:flex;align-items:center;gap:12px;margin-bottom:18px;flex-wrap:wrap;}
  .hello h1{margin:0;font-size:21px;} .hello p{margin:2px 0 0;font-size:13px;color:var(--ink-secondary);}
  .search{flex:1;min-width:220px;max-width:420px;margin-left:auto;display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--border);border-radius:10px;padding:9px 12px;color:var(--ink-muted);font-size:13.5px;}
  .search kbd{margin-left:auto;border:1px solid var(--border);border-radius:5px;padding:1px 6px;font-size:11px;background:#f6f8fb;}
  .ctl{display:inline-flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--border);border-radius:10px;padding:8px 12px;font-size:13px;font-weight:600;}
  .ctl small{color:var(--ink-muted);font-weight:600;text-transform:uppercase;font-size:10.5px;letter-spacing:.04em;}
  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:16px;}
  .kpi{background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;position:relative;}
  .kpi .l{font-size:11.5px;color:var(--ink-muted);font-weight:700;text-transform:uppercase;letter-spacing:.04em;}
  .kpi .v{font-size:26px;font-weight:700;letter-spacing:-.02em;margin:4px 0 2px;}
  .kpi .c{font-size:12.5px;color:var(--ink-secondary);}
  .kpi svg.sp{position:absolute;right:14px;bottom:14px;}
  .grid2{display:grid;grid-template-columns:1.15fr 1fr;gap:16px;margin-bottom:16px;align-items:start;}
  .att{padding:6px 0;}
  .att-item{display:grid;grid-template-columns:30px 1fr auto;gap:12px;align-items:center;padding:11px 18px;border-top:1px solid var(--border);}
  .att-item:first-child{border-top:none;}
  .ic{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:15px;}
  .ic.red{background:#fdecea;color:#c0392b;} .ic.amb{background:#fff4e0;color:#b4540a;} .ic.grn{background:#e6f7ec;color:#0a8a4a;} .ic.blu{background:#e8f1fc;color:#2a78d6;}
  .att-item b{font-size:13.5px;display:block;} .att-item span.s{font-size:12.5px;color:var(--ink-secondary);}

/* ---------- accounts and lines ---------- */
const ACCTS = HIST.accounts.map((a,i) => ({id:i, company:a.company, code:a.code, bdm:a.bdm, tier:'', tierAt:'', pays:new Map()}));
const BY_CODE = new Map(ACCTS.map(a => [a.code.toLowerCase(), a]));
const LINES = HIST.lines.map(l => ({a:l[0], d:l[1], o:String(l[2]), p:(l[3]&&String(l[3]))||'', q:Number(l[4])||0, s:Number(l[5])||0}));
let LIVE_OK = false, LIVE_LAST = '';

function mergeLive(rows){
  for(const r of rows){
    const a = BY_CODE.get(String(r.customer_code||'').trim().toLowerCase());
    if(!a || !r.completed_date) continue;
    const d = sydneyDate(new Date(r.completed_date));
    const tier = String(r.sell_price_tier||'').trim();
    if(tier && d >= a.tierAt){ a.tier = tier; a.tierAt = d; }
    const pm = String(r.payment_mode||'').trim();
    if(pm){ if(!a.pays.has(pm)) a.pays.set(pm, new Set()); a.pays.get(pm).add(r.order_no); }
    if(d <= HIST.through) continue;               // already covered by the embedded history
    LINES.push({a:a.id, d, o:String(r.order_no), p:String(r.product_code||''), q:Number(r.quantity)||0, s:Number(r.sub_total)||0});
    if(d > LIVE_LAST) LIVE_LAST = d;
  }
}
async function fetchLive(){
  const ctl = new AbortController(); const to = setTimeout(() => ctl.abort(), 25000);
  try{
    const hdr = {apikey: SUPA_KEY};
    const lr = await fetch(`${SUPA_URL}/rest/v1/${TABLE}?select=batch_id,imported_at&order=imported_at.desc&limit=1`, {headers:hdr, signal:ctl.signal});
    if(!lr.ok) throw new Error('status ' + lr.status);
    const latest = await lr.json();
    if(!latest.length) return [];
    const rows = [], PAGE = 1000;
    for(let from = 0; ; from += PAGE){
      const rr = await fetch(`${SUPA_URL}/rest/v1/${TABLE}?select=customer_code,completed_date,order_no,product_code,quantity,sub_total,sell_price_tier,payment_mode&batch_id=eq.${encodeURIComponent(latest[0].batch_id)}&order=id.asc`,
        {headers:{...hdr, Range:`${from}-${from+PAGE-1}`, 'Range-Unit':'items'}, signal:ctl.signal});
      if(!rr.ok && rr.status !== 206) throw new Error('status ' + rr.status);
      const page = await rr.json(); rows.push(...page);
      if(page.length < PAGE || rows.length >= 200000) break;
    }
    return rows;
  } finally { clearTimeout(to); }
}

  const e = ASOF; let s;
  if(state.period === 'fytd'){ const y = +e.slice(0,4), m = +e.slice(5,7); s = (m>=7 ? y : y-1) + '-07-01'; }
  else s = dstr(dnum(addYears(e,-1)) + 1);
  return {s, e, ps:addYears(s,-1), pe:addYears(e,-1)};
}
const periodName = () => state.period==='fytd' ? 'This Financial Year' : 'Last 12 Months';

/* ---------- indexes: orders and lines per account ---------- */
let ORD = new Map(), LBY = new Map();
function buildIndex(){
  ORD = new Map(ACCTS.map(a => [a.id, []])); LBY = new Map(ACCTS.map(a => [a.id, []]));
  const tmp = new Map();
  for(const l of LINES){
    if(l.d > ASOF) continue;
    LBY.get(l.a).push(l);
    const k = l.a + '|' + l.o; let x = tmp.get(k);
    if(!x){ x = {a:l.a, o:l.o, d:l.d, t:0}; tmp.set(k,x); }
    if(l.d < x.d) x.d = l.d;
    x.t += l.s;
  }
  for(const x of tmp.values()) if(x.t > 0) ORD.get(x.a).push(x);    // credit notes and zero-value orders are not orders
  for(const arr of ORD.values()) arr.sort((p,q) => p.d<q.d ? -1 : p.d>q.d ? 1 : 0);
}
const sumLines = (arr, s, e) => arr.reduce((t,l) => (l.d>=s && l.d<=e) ? t+l.s : t, 0);

/* ---------- the status rule ---------- */
const ST = {
  quiet:  {label:'Gone Quiet',    cls:'red', icon:'●', rank:0},
  none:   {label:'No Orders Yet', cls:'amb', icon:'○', rank:1},
  lapsed: {label:'Lapsed',        cls:'gry', icon:'●', rank:2},
  slowing:{label:'Slowing',       cls:'amb', icon:'●', rank:3},
  due:    {label:'Reorder Due',   cls:'blu', icon:'●', rank:4},
  new:    {label:'New Customer',  cls:'grn', icon:'●', rank:5},
  healthy:{label:'Healthy',       cls:'grn', icon:'●', rank:6},
};
function stats(a){
  const P = period(), os = ORD.get(a.id), L = LBY.get(a.id), e = ASOF, en = dnum(e);
  const cur = sumLines(L, P.s, P.e), ly = sumLines(L, P.ps, P.pe);
  const ordersCur = os.filter(o => o.d>=P.s && o.d<=P.e).length;
  const l12 = sumLines(L, dstr(en-364), e), p12 = sumLines(L, dstr(en-729), dstr(en-365));
  const last = os.length ? os[os.length-1] : null, first = os.length ? os[0] : null;
  const days = last ? en - dnum(last.d) : null;
  const recent = os.filter(o => dnum(o.d) >= en-730).map(o => dnum(o.d));
  const gaps = []; for(let i=1;i<recent.length;i++){ const g = recent[i]-recent[i-1]; if(g>0) gaps.push(g); }
  const g = gaps.length >= 2 ? Math.round(median(gaps)) : null;     // needs at least 3 orders in 2 years
  const T = g ? Math.max(45, Math.round(2.5*g)) : 90;               // "quiet" threshold: 2.5 x its own gap, or 90 days when there is not enough history
  let status;
  if(!os.length) status = 'none';
  else if(days > 365) status = 'lapsed';
  else if(days > T) status = 'quiet';
  else if(dnum(first.d) >= en-90) status = 'new';
  else if(p12 >= 500 && l12 <= p12*0.75) status = 'slowing';
  else if(g && days >= 0.9*g) status = 'due';
  else status = 'healthy';
  const mi = monthIdx(e), trend = [];
  for(let k=5;k>=0;k--){ const m = mi-k; trend.push(L.reduce((t,l) => monthIdx(l.d)===m ? t+l.s : t, 0)); }
  return {a, os, L, cur, ly, ordersCur, l12, p12, last, first, days, g, T, status, trend};
}

/* ---------- small chart helpers (inline SVG; every mark has a hover tip) ---------- */
function axisTicks(max){ const n = 4, raw = max/n; const e = Math.pow(10, Math.floor(Math.log10(raw||1))); let step = e; for(const m of [1,2,2.5,5,10]) if(m*e >= raw){ step = m*e; break; } const out=[]; for(let v=0; ; v+=step){ out.push(v); if(v >= max-step*0.001) break; } return {ticks:out, top:out[out.length-1]}; }
function spark(vals, w=90, h=24, col='#2a78d6'){
  if(!vals.some(v => v>0)) return '<span class="muted">—</span>';
  const mx = Math.max(...vals), n = vals.length;
  const pts = vals.map((v,i) => [2+(w-4)*i/(n-1), 3+(h-6)*(1-Math.max(v,0)/(mx||1))]), last = pts[n-1];
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-hidden="true"><polyline fill="none" stroke="${col}" stroke-width="1.8" stroke-linejoin="round" points="${pts.map(q => q.map(x=>x.toFixed(1)).join(',')).join(' ')}"/><circle cx="${last[0]}" cy="${last[1]}" r="2.5" fill="${col}"/></svg>`;
}
function barChart(vals, labels, tips, o){
  const w=o.w, h=o.h, l=46, r=8, t=10, b=22, iw=w-l-r, ih=h-t-b, n=vals.length;
  const ax = axisTicks(Math.max(1,...vals)*1.04), top = ax.top, Y = v => t + ih*(1 - Math.max(v,0)/top), slot = iw/n, bw = Math.min(slot*0.64, 26);
  let s = `<svg viewBox="0 0 ${w} ${h}" width="100%" role="img" aria-label="${esc(o.label)}" style="display:block">`;
  ax.ticks.forEach(v => { s += `<line x1="${l}" x2="${w-r}" y1="${Y(v)}" y2="${Y(v)}" stroke="#e9ecf1"/><text x="${l-6}" y="${Y(v)+4}" text-anchor="end" font-size="10.5" fill="#8a93a3">${$k(v)}</text>`; });
  vals.forEach((v,i) => {
    const hh = Math.max(t+ih-Y(v), v>0?2:0);
    s += `<rect x="${l+slot*i+(slot-bw)/2}" y="${t+ih-hh}" width="${bw}" height="${hh}" rx="3" fill="${o.colors[i]}"/>`;
    s += `<text x="${l+slot*i+slot/2}" y="${h-6}" text-anchor="middle" font-size="10.5" fill="#8a93a3">${esc(labels[i])}</text>`;
    s += `<rect class="hit" x="${l+slot*i}" y="${t}" width="${slot}" height="${ih}" fill="transparent" data-tip="${esc(tips[i])}"/>`;
  });
  return s + '</svg>';
}

/* ---------- pieces of the page ---------- */
const chip = st => `<span class="chip ${ST[st].cls}">${ST[st].icon} ${ST[st].label}</span>`;
const tierTag = t => t ? `<span class="tag tag-tier">${esc(t)}</span>` : '<span class="tag-none">—</span>';
const payTags = a => a.pays.size ? `<span class="tag-wrap">${[...a.pays].sort((x,y)=>y[1].size-x[1].size).map(([m,s]) => `<span class="tag tag-pay" title="${esc(m)}: ${s.size} order${s.size===1?'':'s'}">${esc(m)}</span>`).join('')}</span>` : '<span class="tag-none">—</span>';
function delta(cur, prior){
  if(prior > 0){ const p = (cur-prior)/prior*100, up = p >= 0; if(Math.round(p) === 0) return '<span class="muted">No Change</span>'; return `<span class="${up?'up':'down'}">${up?'▲':'▼'} ${Math.abs(p) > 999 ? '999%+' : Math.abs(p).toFixed(0) + '%'}</span>`; }
  return cur > 0 ? '<span class="muted">New</span>' : '<span class="muted">—</span>';
}
const kpi = (label, val, sub, sp) => `<div class="kpi"><div class="l">${esc(label)}</div><div class="v">${val}</div><div class="c">${sub}</div>${sp?`<span class="spw">${sp}</span>`:''}</div>`;

function viewAccts(){ return ACCTS.filter(a => !state.rep || a.bdm === state.rep); }
function matchQ(S, q){
  const s = q.trim().toLowerCase(); if(s.length < 2) return true;
  if(S.a.company.toLowerCase().includes(s) || S.a.code.toLowerCase().includes(s)) return true;
  if(S.os.some(o => o.o.toLowerCase().includes(s))) return true;
  return S.L.some(l => l.p && l.p.toLowerCase().includes(s));
}

/* ---------- needs-attention list ---------- */
function attention(SS){
  const P = period(), who = S => state.rep ? '' : ' · ' + S.a.bdm;
  const act = [], heads = [], good = [];
  for(const S of SS){
    const gap = S.ly - S.cur;
    if(S.status === 'quiet')
      act.push({w:Math.max(gap,0)+S.l12*0.001, S, c:'red', i:'!', t:`No order for ${S.days} days${S.g?` (usually every ~${S.g} days)`:''}${gap>0?` · ${$$(gap)} below last year`:''}${who(S)}`});
    else if(S.status === 'none')
      act.push({w:-1, S, c:'amb', i:'+', t:`No orders since Jul 2020 · first-order follow-up${who(S)}`});
    else if(S.status === 'slowing')
      heads.push({w:S.p12-S.l12, S, c:'amb', i:'↘', t:`Down ${Math.round((1-S.l12/S.p12)*100)}% over 12 months (${$$(S.l12)} vs ${$$(S.p12)})${who(S)}`});
    else if(S.status === 'due')
      heads.push({w:S.days-S.g, S, c:'blu', i:'↻', t:`Usually reorders about every ~${S.g} days · last order ${agoText(S.days)}${who(S)}`});
    else if(S.status === 'lapsed')
      heads.push({w:-S.days, S, c:'gry', i:'◌', t:`No order for ${Math.floor(S.days/30.4)} months · win-back candidate${who(S)}`});
    else if(S.status === 'new')
      good.push({w:S.first.t, S, c:'grn', i:'★', t:`First order ${ddmmyyyy(S.first.d)} (${$$(S.first.t)}) · worth a welcome call${who(S)}`});
    else if(S.ly > 0 && S.cur >= 1000 && S.cur >= S.ly*1.25)
      good.push({w:S.cur-S.ly, S, c:'grn', i:'▲', t:`Up ${Math.round((S.cur/S.ly-1)*100)}% vs last year (${$$(S.cur)} vs ${$$(S.ly)})${who(S)}`});
  }
  const srt = a => a.sort((x,y) => y.w - x.w);
  return {act:srt(act), heads:srt(heads), good:srt(good)};
}
const attRow = x => `<div class="att-item" role="button" tabindex="0" data-acct="${x.S.a.id}"><div class="ic ${x.c}" aria-hidden="true">${x.i}</div><div><b>${esc(x.S.a.company)}</b><span class="s">${esc(x.t)}</span></div><span class="go">Open ›</span></div>`;

/* ---------- pace chart: running total, this period vs the same period a year earlier ---------- */
function paceChart(L){
  const P = period(), base = dnum(P.s), pbase = dnum(P.ps), N = 365;
  const cur = new Array(N).fill(0), prev = new Array(N).fill(0);
  for(const l of L){
    const o = dnum(l.d)-base; if(o>=0 && o<N && l.d<=P.e) cur[o] += l.s;
    const q = dnum(l.d)-pbase; if(q>=0 && q<N) prev[q] += l.s;
  }
  for(let i=1;i<N;i++){ cur[i] += cur[i-1]; prev[i] += prev[i-1]; }
  const t0 = Math.min(N-1, dnum(P.e)-base);
  const w=520, h=290, l0=50, r0=16, t=16, b=26, iw=w-l0-r0, ih=h-t-b;
  const mx = Math.max(1, cur[t0], prev[N-1]), ax = axisTicks(mx*1.06), top = ax.top;
  const X = o => l0 + iw*o/(N-1), Y = v => t + ih*(1 - v/top);
  let s = `<svg viewBox="0 0 ${w} ${h}" width="100%" role="img" aria-label="Running total this period versus last year" style="display:block">`;
  ax.ticks.forEach(v => { s += `<line x1="${l0}" x2="${w-r0}" y1="${Y(v)}" y2="${Y(v)}" stroke="#e9ecf1"/><text x="${l0-8}" y="${Y(v)+4}" text-anchor="end" font-size="11" fill="#8a93a3">${$k(v)}</text>`; });
  const starts = [];                                              // first day of each month inside the 365-day window
  for(let o=0;o<N;o++){ const d = dstr(base+o); if(d.slice(8)==='01' || o===0) starts.push({o, m:+d.slice(5,7)-1, y:+d.slice(0,4), first:d.slice(8)==='01'}); }
  starts.forEach(x => { if(x.first) s += `<text x="${X(x.o)}" y="${h-7}" text-anchor="middle" font-size="11" fill="#8a93a3">${MON[x.m]}</text>`; });
  const pts = (arr, to) => arr.slice(0, to+1).map((v,i) => X(i).toFixed(1)+','+Y(v).toFixed(1)).join(' ');
  s += `<polyline fill="none" stroke="#9aa4b5" stroke-width="2" stroke-linejoin="round" points="${pts(prev, N-1)}"/>`;
  s += `<polyline fill="none" stroke="#2a78d6" stroke-width="2.4" stroke-linejoin="round" points="${pts(cur, t0)}"/>`;
  const gap = cur[t0] - prev[t0];
  s += `<circle cx="${X(t0)}" cy="${Y(cur[t0])}" r="4.5" fill="#2a78d6" stroke="#fff" stroke-width="2"/>`;
  if(Math.abs(gap) >= 1){
    const col = gap<0 ? '#c0392b' : '#0a8a4a';
    s += `<line x1="${X(t0)}" x2="${X(t0)}" y1="${Y(cur[t0])}" y2="${Y(prev[t0])}" stroke="${col}" stroke-width="2" stroke-dasharray="3 3"/>`;
  }
  starts.forEach((x,i) => {
    const a = x.o, nb = i+1<starts.length ? starts[i+1].o : N, end = nb-1;
    const mo = MON[x.m] + ' ' + x.y, haveCur = a <= t0, curV = end <= t0 ? cur[end] : cur[t0];
    const tip = `${mo}${end>t0 && haveCur ? ' (To Date)' : ''}\nRunning Total This Year: ${haveCur ? $$(curV) : 'Not Yet'}\nRunning Total Last Year: ${$$(prev[end])}`;
    s += `<rect class="hit" x="${X(a)}" y="${t}" width="${Math.max(X(nb-1)-X(a),2)}" height="${ih}" fill="transparent" data-tip="${esc(tip)}"/>`;
  });
  return {svg:s+'</svg>', gap};
}

/* ---------- the page body ---------- */
function renderBody(){
  const P = period(), accts = viewAccts(), SS = accts.map(stats);
  const ids = new Set(accts.map(a => a.id)), L = LINES.filter(l => ids.has(l.a) && l.d<=ASOF);
  // KPIs
  const cur = sumLines(L, P.s, P.e), prv = sumLines(L, P.ps, P.pe);
  const oc = SS.reduce((t,S) => t+S.ordersCur, 0), op = SS.reduce((t,S) => t+S.os.filter(o => o.d>=P.ps && o.d<=P.pe).length, 0);
  const aov = oc ? cur/oc : 0, aovp = op ? prv/op : 0;
  const en = dnum(ASOF), ordering = SS.filter(S => S.days!=null && S.days<=90).length;
  const A = attention(SS), followUp = A.act.length;
  const mi = monthIdx(ASOF), mser = f => { const v=[]; for(let k=5;k>=0;k--) v.push(f(mi-k)); return v; };
  const sp1 = mser(m => L.reduce((t,l) => monthIdx(l.d)===m ? t+l.s : t, 0));
  const sp2 = mser(m => SS.reduce((t,S) => t+S.os.filter(o => monthIdx(o.d)===m).length, 0));
  const sp3 = sp1.map((v,i) => sp2[i] ? v/sp2[i] : 0);
  const sp4 = mser(m => SS.filter(S => S.os.some(o => monthIdx(o.d)===m)).length);
  const cmp = (a,b) => b > 0 ? `${delta(a,b)} vs last year` : '<span class="muted">No prior data</span>';
  const tiles = kpi(periodName() === 'This Financial Year' ? 'Sales This Financial Year' : 'Sales, Last 12 Months', $$(cur), cmp(cur,prv), spark(sp1,70,26,'#2a78d6'))
    + kpi('Orders', oc.toLocaleString('en-AU'), cmp(oc,op), spark(sp2,70,26,'#7a4ae0'))
    + kpi('Average Order Value', $$(aov), cmp(aov,aovp), spark(sp3,70,26,'#eb6834'))
    + kpi('Accounts Ordering (90 Days)', `${ordering} of ${accts.length}`, followUp ? `<span class="muted">${plural(followUp,'account')} need${followUp===1?'s':''} a follow-up</span>` : '<span class="muted">No follow-ups needed</span>', spark(sp4,70,26,'#1baf7a'));
  // attention
  const all = [...A.act.map(x=>({...x,g:'a'})), ...A.heads.map(x=>({...x,g:'h'})), ...A.good.map(x=>({...x,g:'g'}))];
  const shown = state.attAll ? all : all.slice(0, 6);
  const attHtml = shown.length ? shown.map(attRow).join('') + (all.length > 6 ? `<button type="button" class="more" data-attall="1">${state.attAll ? 'Show Fewer' : 'Show All ' + all.length}</button>` : '')
    : '<div class="empty-att">Nothing needs attention right now. Every account is ordering as usual.</div>';
  // pace
  const pc = paceChart(L), pn = state.period==='fytd' ? ['This Year','Last Year'] : ['Last 12 Months','Prior 12 Months'];
  const paceSub = state.period==='fytd' ? 'Running Total, Jul – Jun' : 'Running Total, Last 12 Months';
  // accounts table
  const q = state.q;
  let rows = SS.filter(S => matchQ(S, q));
  rows.sort((x,y) => ST[x.status].rank - ST[y.status].rank || y.cur - x.cur || x.a.company.localeCompare(y.a.company));
  const rep = S => state.rep ? '' : `<span class="sub">${esc(S.a.bdm)}</span>`;
  const lastTxt = S => S.last ? `<span title="${esc(ddmmyyyy(S.last.d))}">${esc(agoText(S.days))}</span>` : 'Never';
  const trs = rows.map(S => `<tr class="clickable" tabindex="0" role="button" data-acct="${S.a.id}" aria-label="Open ${esc(S.a.company)}"><td><span class="rep-name">${esc(S.a.company)}</span>${rep(S)}</td><td>${chip(S.status)}</td><td>${(S.a.tier||S.a.pays.size) ? `<span class="tag-wrap">${tierTag(S.a.tier)}${payTags(S.a)}</span>` : '<span class="tag-none">—</span>'}</td><td class="num">${S.cur ? $$(S.cur) : '$0'}</td><td class="num">${delta(S.cur,S.ly)}</td><td>${lastTxt(S)}</td><td>${spark(S.trend)}</td></tr>`).join('')
    || '<tr class="empty-row"><td colspan="7">No accounts match.</td></tr>';
  const cards = rows.map(S => `<div class="acard" role="button" tabindex="0" data-acct="${S.a.id}"><div class="top"><b>${esc(S.a.company)}</b>${chip(S.status)}</div>${rep(S)}<div class="row"><span>${esc(periodName())} <b>${S.cur ? $$(S.cur) : '$0'}</b></span><span>${delta(S.cur,S.ly)}</span></div><div class="row"><span>Last Order</span><span>${lastTxt(S)}</span></div></div>`).join('') || '<div class="acard muted">No accounts match.</div>';
  const cnt = q.trim().length >= 2 ? `${rows.length} of ${accts.length} accounts match` : `${plural(accts.length,'account')} · tap a row to open it`;
  const rules = `<details class="rules"><summary>How Statuses Are Worked Out</summary><div><p><b>Gone Quiet:</b> no order for longer than 2.5 times the account's own usual gap between orders (at least 45 days). With fewer than 3 orders in two years the limit is 90 days. After 12 months without an order it becomes Lapsed.</p><p><b>No Orders Yet:</b> allocated, but no completed order since Jul 2020.</p><p><b>Slowing:</b> last 12 months at least 25% below the 12 months before (and $500 or more a year before).</p><p><b>Reorder Due:</b> the account is at or past 90% of its usual gap between orders and still inside the Gone Quiet limit.</p><p><b>New Customer:</b> first-ever order within the last 90 days.</p><p>Credit notes and zero-value orders are not counted as orders. "Vs Last Year" compares with the same dates a year earlier.</p></div></details>`;
  return `<div class="kpis">${tiles}</div>`
    + `<div class="grid2"><div class="card"><div class="card-head"><h2>Needs Your Attention</h2><span class="count"><span class="chip red">${A.act.length} Action</span> <span class="chip blu">${A.heads.length} Heads-Up</span> <span class="chip grn">${A.good.length} Good News</span></span></div><div class="att">${attHtml}</div></div>`
    + `<div class="card"><div class="card-head"><h2>Am I Keeping Pace?</h2><span class="count">${esc(paceSub)}</span></div><div class="chart-card" style="padding:12px 18px 14px"><div class="legend"><span><i style="background:#2a78d6"></i>${pn[0]}</span><span><i style="background:#9aa4b5"></i>${pn[1]}</span></div>${Math.abs(pc.gap)>=1 ? `<div class="gapline ${pc.gap<0?'down':'up'}">${$$(Math.abs(pc.gap))} ${pc.gap<0?'behind':'ahead of'} last year at this point</div>` : ''}${pc.svg}</div></div></div>`
    + `<div class="card"><div class="card-head"><h2>My Accounts</h2><span class="count">${esc(cnt)}</span></div><div class="table-scroll only-desk"><table class="tbl-compact"><thead><tr><th>Account</th><th>Status</th><th>Tier / Payment</th><th class="num">${state.period==='fytd'?'Sales This FY':'Sales, 12 Months'}</th><th class="num">Vs Last Year</th><th>Last Order</th><th>6-Month Trend</th></tr></thead><tbody>${trs}</tbody></table></div><div class="only-mob" style="padding:10px 12px">${cards}</div></div>`
    + rules;
}

/* ---------- side panel for one account ---------- */
function drawerHTML(id){
  const a = ACCTS[id]; if(!a) return '';
  const S = stats(a), P = period(), mi = monthIdx(ASOF), vals = [], labels = [], tips = [], cols = [];
  for(let k=11;k>=0;k--){ const m = mi-k, v = S.L.reduce((t,l) => monthIdx(l.d)===m ? t+l.s : t, 0); vals.push(v); labels.push(MON[m%12][0]); tips.push(`${miLabel(m)}${k===0?' (To Date)':''}\nSales: ${$$(v)}`); cols.push(k<6 ? '#2a78d6' : '#c9d1de'); }
  const chart = barChart(vals, labels, tips, {w:420, h:170, colors:cols, label:'Monthly sales, last 12 months'});
  const od = [...S.os].reverse().slice(0,5).map(o => `<tr><td>${esc(ddmmyyyy(o.d))}</td><td>${esc(o.o)}</td><td class="num">${$$(o.t)}</td></tr>`).join('') || '<tr class="empty-row"><td colspan="3">No orders yet.</td></tr>';
  const pm = new Map(); S.L.filter(l => dnum(l.d) >= dnum(ASOF)-364).forEach(l => { const k = l.p || '(No Code)'; pm.set(k, (pm.get(k)||0) + l.q); });
  const pr = [...pm].filter(x => x[1] > 0).sort((x,y) => y[1]-x[1]).slice(0,5).map(([k,q]) => `<tr><td>${esc(k)}</td><td class="num">${plural(q,'Unit')}</td></tr>`).join('') || '<tr class="empty-row"><td colspan="2">No products in the last 12 months.</td></tr>';
  return `<div class="scrim" data-close="1"></div><aside class="drawer" role="dialog" aria-modal="true" aria-label="${esc(a.company)}">
    <div style="display:flex;justify-content:space-between;align-items:center"><span class="muted" style="font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase">Account</span><button type="button" class="xbtn" data-close="1" aria-label="Close">×</button></div>
    <h2>${esc(a.company)}</h2><div class="muted" style="font-size:12.5px">Customer Code: ${esc(a.code)}</div>
    <div class="meta">${chip(S.status)}${tierTag(a.tier)}${payTags(a)}<span class="chip gry">Rep: ${esc(a.bdm)}</span></div>
    <div class="mini-kpis"><div><small>${state.period==='fytd'?'Sales This FY':'Sales, 12 Months'}</small><strong>${$$(S.cur)}</strong></div><div><small>Vs Last Year</small><strong>${delta(S.cur,S.ly)}</strong></div><div><small>Last Order</small><strong>${S.last ? esc(agoText(S.days)) : 'Never'}</strong></div></div>
    <div class="sec">Monthly Sales, Last 12 Months</div>${chart}
    <div class="sec">Latest Orders</div><table class="tbl-compact"><tbody>${od}</tbody></table>
    <div class="sec">Top Products, Last 12 Months</div><table class="tbl-compact"><tbody>${pr}</tbody></table>
    <div class="btns"><a class="pbtn" href="${PRICE_URL}" target="_blank" rel="noopener">Check Price &amp; Stock ↗</a><a class="sbtn" href="history.html#trend=${encodeURIComponent(a.code)}">View In History</a></div></aside>`;
}

/* ---------- shell ---------- */
function greeting(){
  const h = +new Date().toLocaleString('en-AU', {timeZone:'Australia/Sydney', hour:'numeric', hour12:false}) % 24;
  const g = h < 12 ? 'Good Morning' : h < 17 ? 'Good Afternoon' : 'Good Evening';
  return state.rep ? g + ', ' + state.rep.split(' ')[0] : g;
}
function renderPill(){
  const el = document.getElementById('dataPill');
  if(LIVE_OK){ el.classList.remove('stale'); el.innerHTML = '<span class="dot"></span>Live Feed To ' + esc(ddmmyyyy(LIVE_LAST || HIST.through)); }
  else { el.classList.add('stale'); el.innerHTML = '<span class="dot"></span>History Only To ' + esc(ddmmyyyy(HIST.through)); }
}
function render(){
  buildIndex();
  document.getElementById('hello').textContent = greeting();
  document.getElementById('helloSub').textContent = state.rep ? 'Here is what needs your attention today.' : 'Here is what needs attention across all sales reps today.';
  const warn = LIVE_OK ? '' : `<div class="note" style="margin:0 0 14px">The live feed could not be reached, so this page only shows history up to ${esc(ddmmyyyy(HIST.through))} and works out every status as at that date. Reload to try again.</div>`;
  const info = `<div class="infobar"><span>ⓘ</span><span><b>Who Is Included:</b> The ${ACCTS.length} Allocated Accounts In Alicia&#39;s List, Each Under Its Current Sales Rep. Amounts Are Sub Total From The Unleashed Sales Enquiry; Jul 2020 – Jun 2026 Is History And Jul 2026 Onward Is The Live Feed.</span></div>`;
  document.getElementById('root').innerHTML = warn + renderBody() + info;
  const dr = document.getElementById('drawerRoot');
  dr.innerHTML = state.open == null ? '' : drawerHTML(state.open);
  if(state.open != null){ const x = dr.querySelector('.xbtn'); if(x) x.focus(); }
}

/* ---------- events (delegated; nothing from the data is ever placed in an inline handler) ---------- */
const tip = document.getElementById('tip');
document.addEventListener('mousemove', e => {
  const el = e.target.closest && e.target.closest('[data-tip]');
  if(!el){ tip.style.display = 'none'; return; }
  tip.textContent = el.getAttribute('data-tip'); tip.style.display = 'block';
  const x = Math.min(e.clientX + 14, window.innerWidth - tip.offsetWidth - 8), y = Math.min(e.clientY + 14, window.innerHeight - tip.offsetHeight - 8);
  tip.style.left = Math.max(4,x) + 'px'; tip.style.top = Math.max(4,y) + 'px';
});
function openAcct(id){ state.open = id; render(); }
function closeAcct(){ if(state.open == null) return; const id = state.open; state.open = null; render(); const el = document.querySelector(`[data-acct="${id}"]`); if(el) el.focus(); }
document.addEventListener('click', e => {
  const c = e.target.closest('[data-close]'); if(c){ closeAcct(); return; }
  const m = e.target.closest('[data-attall]'); if(m){ state.attAll = !state.attAll; render(); return; }
  const a = e.target.closest('[data-acct]'); if(a){ openAcct(Number(a.dataset.acct)); }
});
document.addEventListener('keydown', e => {
  if(e.key === 'Escape' && state.open != null){ closeAcct(); return; }
  if((e.key === 'Enter' || e.key === ' ') && e.target.matches && e.target.matches('[data-acct]')){ e.preventDefault(); openAcct(Number(e.target.dataset.acct)); }
  if(e.key === '/' && !/INPUT|SELECT|TEXTAREA/.test((e.target.tagName||''))){ e.preventDefault(); document.getElementById('q').focus(); }
});
document.getElementById('repSel').addEventListener('change', e => { state.rep = e.target.value; try{ localStorage.setItem(REP_KEY, state.rep); }catch(_){} render(); });
document.getElementById('perSel').addEventListener('change', e => { state.period = e.target.value; render(); });
document.getElementById('q').addEventListener('input', e => { state.q = e.target.value; render(); });
document.getElementById('menuBtn').addEventListener('click', () => document.querySelector('.sidebar').classList.toggle('open'));
document.getElementById('signOutBtn').addEventListener('click', () => { try{ localStorage.removeItem(AUTH_KEY); }catch(_){} location.reload(); });

/* ---------- sign-in gate (same password and same browser sign-in as the dashboard) ---------- */
async function sha256Hex(text){ const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text)); return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2,'0')).join(''); }
function initControls(){
  const reps = [...new Set(ACCTS.map(a => a.bdm))].sort();
  document.getElementById('repSel').innerHTML = `<option value="">All Sales Reps</option>` + reps.map(r => `<option value="${esc(r)}">${esc(r)}</option>`).join('');
  let saved = ''; try{ saved = localStorage.getItem(REP_KEY) || ''; }catch(_){}
  if(reps.includes(saved)) state.rep = saved;
  document.getElementById('repSel').value = state.rep;
}
async function start(){
  document.getElementById('authOverlay').setAttribute('hidden','');
  initControls(); setAsOf(); render();
  try { mergeLive(await fetchLive()); LIVE_OK = true; } catch(err){ console.error(err); LIVE_OK = false; }
  setAsOf(); renderPill(); render();
}
async function initAuth(){
  let ok = false;
  try { ok = localStorage.getItem(AUTH_KEY) === AUTH_HASH; } catch(_){}
  if(ok){ start(); return; }
  const form = document.getElementById('authForm'), input = document.getElementById('authPassword'), err = document.getElementById('authError'), toggle = document.getElementById('authToggle');
  toggle.addEventListener('click', () => { const show = input.type==='password'; input.type = show ? 'text' : 'password'; toggle.setAttribute('aria-label', show ? 'Hide password' : 'Show password'); });
  form.addEventListener('submit', async e => {
    e.preventDefault(); err.textContent = '';
    if(!input.value){ err.textContent = 'Enter the password.'; return; }
    if(await sha256Hex(input.value) === AUTH_HASH){ try{ localStorage.setItem(AUTH_KEY, AUTH_HASH); }catch(_){} start(); }
    else { err.textContent = 'Incorrect password.'; input.value = ''; input.focus(); }
  });
  input.focus();
}
initAuth();

</script>
</body>
